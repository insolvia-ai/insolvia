# The integration tier (integration/README.md). Not a package: only pytest's
# configuration, so `tests` imports from this directory.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# --strict-markers: an unregistered mark is an error, not a warning, so a
# typo in `parametrize` cannot degrade a table-driven test into one no-op.
# --strict-config: the same for typos in this block.
addopts = "-q --strict-markers --strict-config"
markers = []
