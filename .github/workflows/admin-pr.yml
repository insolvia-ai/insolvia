name: Admin · PR

# The staff admin portal (apps/insolvia_admin). The admin SERVICE it calls is
# .NET since the switch (backend/src/Insolvia.Admin) and is checked by
# backend-pr.yml's `Backend (.NET)`.
#
# No `on.pull_request.paths:` filter, deliberately — see
# `.github/actions/changed-paths/action.yml`. This job becomes a required
# status check on `protect-main` (added post-merge via
# scripts/update-ruleset.sh), so it must trigger and report on *every* PR;
# the `steps.filter` guard below is what keeps an unrelated PR cheap.
# Re-adding a `paths:` filter would silently deadlock every PR that does not
# touch these paths.
on:
  pull_request:

permissions:
  contents: read
  # The portal job installs @insolvia-ai/design-system from GitHub Packages;
  # the job's GITHUB_TOKEN needs read access to pull it (same line, same
  # reason, as marketing-pr.yml's).
  packages: read

jobs:
  portal:
    name: Admin portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/insolvia_admin
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            apps/insolvia_admin/**
            packages/insolvia_admin_client/**
            .github/workflows/admin-pr.yml
            .github/actions/changed-paths/action.yml

      - uses: actions/setup-node@v5
        if: steps.filter.outputs.run == 'true'
        with:
          node-version: 24

      # Own lockfile, own install — deliberately outside the npm workspace,
      # like marketing: this `npm ci` from a clean registry is what proves the
      # published design-system install works. Its one local dependency,
      # @insolvia-ai/admin-client, is `file:../../packages/insolvia_admin_client`
      # in this same checkout, so the build compiles the client the portal ships.
      - name: Install
        if: steps.filter.outputs.run == 'true'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        if: steps.filter.outputs.run == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.filter.outputs.run == 'true'
        run: npm run lint

      - name: Test
        if: steps.filter.outputs.run == 'true'
        run: npm test

      - name: Build
        if: steps.filter.outputs.run == 'true'
        env:
          VITE_INSOLVIA_ENV: staging
        run: npm run build

      # The same invariant marketing's grep guard holds: the design system's
      # .web leaves keep react-native out of a web bundle. A resolve change
      # that broke the platform split would surface here, not in a browser.
      - name: Assert react-native stayed out of the bundle
        if: steps.filter.outputs.run == 'true'
        run: |
          if grep -rq "react-native" dist/assets/; then
            echo "::error::react-native leaked into the admin portal bundle"
            exit 1
          fi

  # The portal's client as a package (ADR 0029 rule 2): its own format, lint,
  # typecheck and Jest suite, from the ROOT workspace it is a member of. The
  # portal job above proves the portal builds against it; this proves the
  # package itself. Not a required check — the `Admin portal` job is.
  client:
    name: Admin client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            packages/insolvia_admin_client/**
            package.json
            package-lock.json
            tsconfig.base.json
            eslint.base.js
            jest.base.js
            .prettierrc
            .prettierignore
            .github/workflows/admin-pr.yml
            .github/actions/changed-paths/action.yml

      - uses: actions/setup-node@v5
        if: steps.filter.outputs.run == 'true'
        with:
          node-version: "24"
          cache: npm

      - name: Install
        if: steps.filter.outputs.run == 'true'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format check
        if: steps.filter.outputs.run == 'true'
        run: npx prettier --check packages/insolvia_admin_client

      - name: Lint
        if: steps.filter.outputs.run == 'true'
        run: npm run lint --workspace @insolvia-ai/admin-client

      - name: Typecheck
        if: steps.filter.outputs.run == 'true'
        run: npm run typecheck --workspace @insolvia-ai/admin-client

      - name: Test
        if: steps.filter.outputs.run == 'true'
        run: npm run test --workspace @insolvia-ai/admin-client
