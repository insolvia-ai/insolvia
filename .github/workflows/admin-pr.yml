name: Admin · PR

# No `on.pull_request.paths:` filter, deliberately — see
# `.github/actions/changed-paths/action.yml`. This job becomes a required
# status check on `protect-main` (added post-merge via
# scripts/update-ruleset.sh), so it must trigger and report on *every* PR;
# the `steps.filter` guard below is what keeps an unrelated PR cheap.
# Re-adding a `paths:` filter would silently deadlock every PR that does not
# touch these paths.
on:
  pull_request:

permissions:
  contents: read

jobs:
  admin:
    name: Admin service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/admin
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the guard can diff against the PR base commit.
          fetch-depth: 0

      - id: filter
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            services/admin/**
            # The shared domain this service installs from a local path (issue
            # #208) — a core change must re-run this suite and image build.
            packages/insolvia_core/**
            # Shared root lint config — a rule change must re-lint this service.
            ruff.toml
            .github/workflows/admin-pr.yml
            .github/actions/changed-paths/action.yml

      - uses: actions/setup-python@v6
        if: steps.filter.outputs.run == 'true'
        with:
          # Matches the Lambda base image (public.ecr.aws/lambda/python:3.12)
          # and pyproject's requires-python.
          python-version: "3.12"

      - name: Install dependencies
        if: steps.filter.outputs.run == 'true'
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        if: steps.filter.outputs.run == 'true'
        run: ruff check .

      - name: Format check
        if: steps.filter.outputs.run == 'true'
        run: ruff format --check .

      - name: Type check
        if: steps.filter.outputs.run == 'true'
        run: mypy

      - name: Test
        if: steps.filter.outputs.run == 'true'
        run: pytest

      # Packaging check: the exact image the deploy workflows will ship must
      # build. Context is the repo root because the image installs
      # packages/insolvia_core by relative path (see the Dockerfile header).
      - name: Build Lambda image
        if: steps.filter.outputs.run == 'true'
        working-directory: ${{ github.workspace }}
        run: docker build --target lambda -f services/admin/Dockerfile -t insolvia-admin-pr-check .
