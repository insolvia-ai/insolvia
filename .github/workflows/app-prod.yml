name: App · Deploy · Production

# The one deploy in this repo that still BUILDS rather than promotes, and the
# reason is the app's environment model, not an oversight.
#
# The app selects its environment at BUILD time. `EXPO_PUBLIC_*` variables are
# inlined into the JS bundle by Metro when it bundles (see
# apps/insolvia_app and docs/reference/architecture.md § Environment model), so the
# staging bundle has "staging" baked into it and can never be the production
# bundle. There is no artifact to promote the way api, mailer and marketing
# promote an image digest.
#
# What this workflow guarantees instead is SOURCE-level promotion, tightened at
# both ends:
#   • the commit must have a successful `app-staging.yml` run before it can
#     ship (.github/actions/verified-commit), and the build is checked out at
#     that exact commit rather than whatever main points at now, and
#   • the Node major is pinned and the install is `npm ci` from a committed
#     lockfile, so "same source" also means "same toolchain and same dependency
#     tree". A prod rebuild weeks after the staging run resolves the identical
#     packages.
#
# Getting byte-identical promotion here would mean moving the app to runtime
# environment detection (one bundle, resolved from the serving hostname). That
# is a real option and deliberately not taken — it would reverse the documented
# compile-time environment decision.
#
# This workflow does not apply Terraform — `infra-prod.yml` is the only path
# that mutates prod infrastructure.
#
# ── Why the commit is resolved in its own job ─────────────────────────────────
# `resolve` is deliberately NOT `environment: insolvia-production`-gated; only
# `deploy` is. It touches no AWS credentials and publishes nothing, so running
# it first means a commit that never passed staging is rejected BEFORE anyone is
# asked to approve a production deploy.
#
# ── No desktop publishing, by decision ────────────────────────────────────────
# The case is recorded in docs/adr/0004-react-native-replaces-flutter.md —
# read it before adding desktop artifact publishing here.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to deploy (default: main HEAD). Must have deployed green to staging."
        required: false
        type: string
      force:
        description: "Skip the staging-green check (emergency only)"
        required: false
        default: false
        type: boolean

  # Also callable by the Release · Production orchestrator, which chains the
  # services in a defined order. Same inputs as the manual dispatch above, so
  # there is exactly one code path either way.
  workflow_call:
    inputs:
      sha:
        description: "Commit to deploy (default: main HEAD). Must have deployed green to staging."
        required: false
        type: string
      force:
        description: "Skip the staging-green check (emergency only)"
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  # Reading the staging workflow's run conclusions.
  actions: read

# This workflow applies no Terraform, but the group still serializes it
# against infra-prod.yml, so a deploy cannot land mid-apply while the bucket
# or distribution is being reconciled underneath it.
concurrency:
  group: insolvia-terraform-prod
  cancel-in-progress: false

jobs:
  # Resolve + verify once, before the production environment gate below.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: commit
        uses: ./.github/actions/verified-commit
        with:
          staging-workflow: app-staging.yml
          sha: ${{ inputs.sha }}
          force: ${{ inputs.force }}

  deploy:
    needs: [resolve]
    runs-on: ubuntu-latest
    environment: insolvia-production
    steps:
      # Checked out at the verified commit, not at whatever `main` points at
      # now — the whole point of the `resolve` job above.
      - name: Check out the verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # Must match the root package.json's `engines.node` (">=24"). Pinning the
      # major is what makes "same source" mean "same toolchain" — see the header.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # `ci`, never `install`: it installs exactly the committed lockfile, which
      # is the other half of the reproducibility guarantee in the header.
      - run: npm ci

      # ── Infra outputs are read BEFORE the build, not after ────────────────
      #
      # The app reads its Cognito configuration at BUILD time — Metro inlines
      # `EXPO_PUBLIC_COGNITO_DOMAIN` and `EXPO_PUBLIC_COGNITO_CLIENT_ID` into
      # the bundle — and both values are outputs of infra/envs/prod
      # (`auth_domain`, `auth_web_client_id`). So the read has to happen first.
      # Only the step ORDER changed; this is the same read-only `terraform
      # output` this workflow has always done.
      #
      # It is race-free for a reason specific to prod: this workflow applies no
      # Terraform, `infra-prod.yml` is the only thing that applies
      # infra/envs/prod, and the `insolvia-terraform-prod` concurrency group
      # above serializes the two — so no apply can be in flight while these
      # outputs are read. (Staging cannot rely on that, because it applies in
      # the same run; see the job-order note in app-staging.yml.)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
          # The wrapper interposes on stdout, which corrupts the
          # `terraform output -raw` capture below.
          terraform_wrapper: false

      # Read-only: `output` needs the state, not an apply.
      #
      # Neither auth value is a secret — the client id rides in the query string
      # of every `/oauth2/authorize` redirect and the domain *is* the URL — which
      # is what makes an `EXPO_PUBLIC_` name legitimate for them. Nothing secret
      # may ever carry that prefix; it is inlined into a bundle any visitor can
      # read.
      - name: Read prod infra outputs
        id: tf
        run: |
          terraform -chdir=infra/envs/prod init -input=false
          tf() { terraform -chdir=infra/envs/prod output -raw "$1"; }
          {
            echo "bucket=$(tf bucket_name)"
            echo "dist=$(tf distribution_id)"
            echo "url=$(tf url)"
            echo "auth_domain=$(tf auth_domain)"
            echo "auth_client_id=$(tf auth_web_client_id)"
          } >> "$GITHUB_OUTPUT"

      # ── The Metro cache trap — this is why `--clear` is here ──────────────
      #
      # `EXPO_PUBLIC_*` is inlined at bundle time, but Metro's transform cache
      # keys on file CONTENT and CONFIG — not on the environment the build ran
      # in. An unchanged tree exported twice with different
      # `EXPO_PUBLIC_INSOLVIA_ENV` values can therefore hit the same cache
      # entries and emit byte-identical output. Here that is the worst version
      # of the bug: a bundle with `staging` baked in, uploaded to the production
      # bucket, talking to the staging API — with nothing in the logs to say so.
      #
      # `--clear` drops the cache before bundling, so the environment cannot be
      # inherited from any previous build. See the fuller note in
      # app-staging.yml for why this is preferred over a per-env
      # `cacheStoreDirectory`.
      #
      # Routed through the app's own `build` script (`expo export -p web
      # --clear`) so prod, staging and the PR gate all share one definition of
      # a web build. The `--clear` lives in the script and ONLY there — expo
      # rejects a repeated flag, so appending `-- --clear` here breaks the
      # build (it did once, on the staging deploy).
      # The Cognito pair is what turns a green deploy into a signable-in app.
      # `terraform output -raw` fails outright on an output that does not exist,
      # but SUCCEEDS on one that exists and is empty — and an empty
      # `EXPO_PUBLIC_*` is inlined as an empty string, producing a bundle that
      # builds, deploys, serves 200, and cannot sign anyone in. Production is
      # where that must never happen quietly, and staging's E2E job cannot catch
      # it because prod builds its own bundle (see this workflow's header).
      - name: Build web (production)
        env:
          EXPO_PUBLIC_INSOLVIA_ENV: production
          EXPO_PUBLIC_COGNITO_DOMAIN: ${{ steps.tf.outputs.auth_domain }}
          EXPO_PUBLIC_COGNITO_CLIENT_ID: ${{ steps.tf.outputs.auth_client_id }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "$EXPO_PUBLIC_COGNITO_DOMAIN" ] || missing+=(EXPO_PUBLIC_COGNITO_DOMAIN)
          [ -n "$EXPO_PUBLIC_COGNITO_CLIENT_ID" ] || missing+=(EXPO_PUBLIC_COGNITO_CLIENT_ID)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Empty Cognito build config: ${missing[*]}. These come from the" \
                 "infra/envs/prod outputs auth_domain / auth_web_client_id. Refusing to" \
                 "ship a production bundle that cannot sign anyone in."
            exit 1
          fi
          echo "Cognito hosted UI: $EXPO_PUBLIC_COGNITO_DOMAIN (client ${EXPO_PUBLIC_COGNITO_CLIENT_ID:0:6}…)"

          npm run build --workspace apps/insolvia_app

      # ── Two-tier cache sync, inline ──────────────────────────────────────
      #
      # Expo content-hashes its bundle. Verified against a real export:
      #   _expo/static/js/web/entry-<hash>.js
      #   _expo/static/css/global-<hash>.css
      # so everything under `_expo/` is content-addressed and safe to cache
      # forever.
      #
      # TWO tiers, not one. The marketing site gets away with a single immutable
      # pass (marketing-prod.yml) only because its bucket holds nothing but
      # hashed assets — its HTML comes from a Lambda. This bucket holds
      # `index.html` plus the app's whole unhashed `public/` payload, so a single
      # immutable pass would pin a returning browser to a stale shell for a
      # year, and no invalidation can reach a client-side cache. Do not
      # "simplify" this into marketing's version.
      #
      # ORDER MATTERS: hashed first, because `index.html` names the chunks it
      # loads. HTML first would open a window where the live page referenced a
      # chunk that was not uploaded yet.
      #
      # NO `--delete` ON THE HASHED PASS, deliberately. This distribution
      # rewrites 403/404 to `index.html` for SPA deep links, so a pruned chunk
      # does not 404 — CloudFront returns `index.html` with HTTP 200 and
      # `Content-Type: text/html`, and the browser fails with "Expected a
      # JavaScript module script but the server responded with a MIME type of
      # text/html". Anyone still on the previous page when a deploy lands gets
      # that error instead of a clean reload. Old chunks cost pennies; prune
      # them on a lag, never in the same breath as an upload.
      - name: Sync to S3 + invalidate
        env:
          SRC: apps/insolvia_app/dist
          BUCKET: ${{ steps.tf.outputs.bucket }}
          DIST: ${{ steps.tf.outputs.dist }}
        run: |
          set -euo pipefail

          # 1. Hashed, content-addressed assets — first, and cached forever.
          aws s3 sync "$SRC/_expo" "s3://$BUCKET/_expo" \
            --cache-control "public,max-age=31536000,immutable"

          # 2. Everything else — index.html and the unhashed `public/` payload.
          #    Never cached: stable names, changing bytes.
          aws s3 sync "$SRC" "s3://$BUCKET" --exclude "_expo/*" \
            --cache-control "no-cache,no-store,must-revalidate"

          # 3. Invalidate the edge.
          #    Tier 2 is `no-store` at the browser, but CloudFront's managed
          #    CachingOptimized policy has a 1s minimum TTL that overrides an
          #    origin `no-cache`, so the edge still needs telling.
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"

      # A static bundle has no version to smoke-test before traffic moves, so
      # unlike the Lambda services this can only be verified after the fact.
      - name: Smoke check
        env:
          URL: ${{ steps.tf.outputs.url }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          curl -sSf -o /dev/null --retry 5 --retry-delay 3 --retry-all-errors "$URL/"
          echo ":white_check_mark: \`$URL\` is serving commit \`${SHA:0:7}\`." \
            >> "$GITHUB_STEP_SUMMARY"
