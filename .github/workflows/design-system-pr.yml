name: Design system · PR

# No `on.pull_request.paths:` filter, deliberately — see
# `.github/actions/changed-paths/action.yml`. The job below is a required status
# check on `protect-main`, so it must trigger and report on *every* PR; the
# `steps.filter` guard is what keeps an unrelated PR cheap. Re-adding a
# `paths:` filter would silently deadlock every PR that does not touch these
# paths. For the same reason there is no job-level `if:` — a skipped job's
# standing with a required check is a subtlety this repo refuses to rest on.
#
# The ruleset matches the job name `Design system` by EXACT name (see the
# insolvia-branch-protection skill), so renaming the job silently orphans the
# gate.
on:
  pull_request:

permissions:
  contents: read

# No `defaults.run.working-directory`: this
# package is an npm *workspace member*, so every step below runs at the repo
# root — the install is the root `npm ci`, and the package's own scripts are
# reached with `--workspace` (same shape as api-client-pr.yml).
jobs:
  design-system:
    name: Design system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the guard can diff against the PR base commit.
          fetch-depth: 0

      - id: filter
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            packages/insolvia_design_system/**
            # This package's theme.css is GENERATED from the tokens package, so
            # a tokens-only PR must still run the drift check below.
            packages/insolvia_tokens/**
            # Cognito's managed-login colours are a third generated output of
            # the same tokens run. It lives under infra/, so without this line a
            # PR that hand-edited only that file would skip the drift gate and
            # merge a sign-in page whose colours no longer match the tokens —
            # the same hole the two root-manifest lines below close.
            infra/modules/auth/managed-login-settings.json
            # Workspace member: the root manifest and lockfile ARE this
            # package's install inputs. Without these two lines a PR touching
            # only the root lockfile would skip this gate, merge, and break the
            # next PR that does touch a listed path — with the failure landing
            # on that PR's author instead.
            package.json
            package-lock.json
            # Shared root config that the package's typecheck/lint/format
            # resolve through.
            tsconfig.base.json
            eslint.base.js
            .prettierrc
            .prettierignore
            .github/workflows/design-system-pr.yml
            .github/actions/changed-paths/action.yml

      # Must match the root package.json's `engines.node` (">=24"). No
      # `cache-dependency-path`, unlike design-system-react-pr.yml: the
      # lockfile this job installs from is the repo-root one setup-node already
      # looks for by default — the package has no lockfile of its own.
      - uses: actions/setup-node@v5
        if: steps.filter.outputs.run == 'true'
        with:
          node-version: "24"
          cache: npm

      # Version-bump gate. Every merge to main that changes this package must
      # bump `version` in package.json, because the publish workflow
      # (design-system-publish.yml) is idempotent by version: it skips cleanly
      # when package.json's version already exists in the registry. An unbumped
      # package change therefore merges green, publishes nothing, and silently
      # rots the registry — the marketing site installs the published package,
      # never the source by path, so it would keep building against a stale
      # artifact with no error anywhere. (The app consumes this package by
      # workspace symlink and always sees source; the marketing site is who
      # this gate protects.)
      #
      # The `steps.filter` guard above also matches tokens/root/workflow paths
      # that don't touch the package, so this step re-diffs against the PR base
      # and only demands a bump when something under the package directory
      # actually changed. Checkout uses `fetch-depth: 0`, so the base commit is
      # present.
      #
      # ONE DELIBERATE SOFTENING of the react gate's "if the base package.json
      # cannot be read, hard error" rule: this package is INTRODUCED by a PR,
      # so the base commit legitimately has no
      # packages/insolvia_design_system/package.json. That case is detected
      # explicitly — a package's first version is a version change by
      # definition, so it passes with a log line. Every other failure (base
      # commit unreachable, unparseable JSON) still fails the step loudly via
      # `set -e`, never a silent pass.
      - name: Require a version bump when the package changed
        if: steps.filter.outputs.run == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          PKG_DIR="packages/insolvia_design_system"

          # Only changes inside the package itself require a bump.
          if git diff --quiet "$BASE_SHA" HEAD -- "$PKG_DIR"; then
            echo "No changes under $PKG_DIR/ — no version bump required."
            exit 0
          fi

          # Fail loudly if the base COMMIT is missing — that would mean the
          # diff above lied. (The changed-paths action already fetched and
          # verified it, so this is belt-and-braces.)
          git cat-file -e "$BASE_SHA^{commit}"

          # With the commit known present, a missing blob means the FILE does
          # not exist at base: this PR introduces the package.
          if ! git cat-file -e "$BASE_SHA:$PKG_DIR/package.json" 2>/dev/null; then
            echo "$PKG_DIR/package.json does not exist at the PR base — this PR introduces the package. A first version is a version change by definition; nothing to compare, passing."
            exit 0
          fi

          # `git show` exits non-zero if the read fails; with `set -e` that
          # fails the step loudly instead of letting a broken guard wave the
          # PR through.
          BASE_PKG="$(git show "$BASE_SHA:$PKG_DIR/package.json")"
          BASE_VERSION="$(node -p 'JSON.parse(process.argv[1]).version' "$BASE_PKG")"
          HEAD_VERSION="$(node -p "require('./$PKG_DIR/package.json').version")"

          if [ "$HEAD_VERSION" = "$BASE_VERSION" ]; then
            echo "::error file=packages/insolvia_design_system/package.json::This PR changes packages/insolvia_design_system/ but leaves version at $BASE_VERSION. This package publishes on every merge to main; bump \`version\` in package.json — the marketing site installs the published package."
            exit 1
          fi

          echo "Version bumped: $BASE_VERSION -> $HEAD_VERSION."

      # `ci`, never `install`: the lockfile is committed precisely so CI
      # resolves the same tree twice running, and `ci` fails loudly when
      # package.json and the lockfile have drifted apart. Run from the repo
      # root — it installs every workspace member (this package included) and
      # links them into node_modules/@insolvia-ai.
      - name: Install
        if: steps.filter.outputs.run == 'true'
        run: npm ci

      # This package's theme.css is GENERATED from
      # packages/insolvia_tokens/tokens.json — the generator now writes it
      # here. Runs before lint/typecheck/test for the honest failure: if
      # someone hand-edited a generated file, the error should be "you edited
      # the wrong file", not a downstream complaint about the edit.
      #
      # This is the same drift gate design-system-react-pr.yml runs today; it
      # moves here for good when PR 2 deletes that workflow with the old
      # package.
      - name: Token drift check
        if: steps.filter.outputs.run == 'true'
        run: npm run tokens:check

      # Run via the package's own script, not `npx eslint <path>` from the
      # root: there is deliberately no `eslint.config.js` at the repo root (see
      # eslint.base.js), so ESLint invoked with the root as its cwd would find
      # no config at all.
      - name: Lint
        if: steps.filter.outputs.run == 'true'
        run: npm run lint --workspace @insolvia-ai/design-system

      # Two granular steps rather than the package's combined `typecheck` (which
      # chains both platforms so the root `npm run ci` fan-out covers native
      # too) — a red X should say WHICH platform broke.
      - name: Typecheck (web)
        if: steps.filter.outputs.run == 'true'
        run: npm run typecheck:web --workspace @insolvia-ai/design-system

      # The `.native.tsx` leaves compile against real react-native types — the
      # one platform this repo's web-only CI otherwise never exercises. Without
      # this leg a PR could be green everywhere and still ship native leaves
      # that do not typecheck the moment Metro resolves them.
      - name: Typecheck (native)
        if: steps.filter.outputs.run == 'true'
        run: npm run typecheck:native --workspace @insolvia-ai/design-system

      - name: Test
        if: steps.filter.outputs.run == 'true'
        run: npm run test --workspace @insolvia-ai/design-system

      # Scoped to this package, not the repo. The root `format` script covers
      # every workspace member, and this gate must not go red because a
      # *different* package has a formatting error — that package has its own
      # gate.
      - name: Format check
        if: steps.filter.outputs.run == 'true'
        run: npx prettier --check packages/insolvia_design_system
