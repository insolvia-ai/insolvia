name: Mailer · Deploy · Staging

# Steady-state deploy: apply the env, push a fresh image, point all three
# mailer Lambdas (ingress/sender/feedback — one image, three entrypoints) at
# it. Unlike api-staging.yml, there is no "re-derive Lambda environment from
# SSM" step: every mailer Lambda's `environment` block is Terraform-managed
# (see the lifecycle note in infra/modules/mailer/main.tf) — every value it
# sets is deterministic from this module's own resources, so nothing needs
# deriving out-of-band at deploy time. The apply above already reconciled it.
#
# The FIRST deploy in a fresh environment cannot run through this workflow: an
# Image-package Lambda refuses to be created before its image exists, so the
# apply below deadlocks. Bootstrap once by hand, per
# infra/modules/mailer/main.tf:
#   1. terraform -chdir=infra/envs/shared apply   (creates insolvia-mailer)
#   2. docker build --target lambda services/mailer, tag <repo-url>:staging, push
#   3. terraform apply   (full)
# After that, every deploy is this workflow.
#
# Deploy workflows are not required status checks, so — unlike the *-pr.yml
# gates — a `paths:` filter here is safe (same as api-staging.yml).

on:
  # Reusable: release-staging.yml calls this as one leg of a staging
  # release, and it stays dispatchable by hand for a single-service deploy.
  # The `push:` trigger moved to release-staging.yml, which now owns both the
  # trigger and the path filtering for every staging deploy.
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Held while this workflow deploys, and shared with infra-staging.yml so a
# hand-dispatched single-service deploy cannot overlap a Terraform apply.
# release-staging.yml deliberately declares NO group of its own: a group on both
# caller and callee deadlocks, and `needs` already orders the legs.
concurrency:
  group: insolvia-terraform-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: insolvia-staging
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"
          # The wrapper interposes on stdout, which corrupts the
          # `terraform output -raw` / `-json` command substitutions below.
          terraform_wrapper: false

      - name: Read staging infra outputs
        id: tf
        run: |
          terraform -chdir=infra/envs/staging init
          {
            echo "repo=$(terraform -chdir=infra/envs/staging output -raw mailer_ecr_repository_url)"
            echo "domain=$(terraform -chdir=infra/envs/staging output -raw mailer_api_url)"
          } >> "$GITHUB_OUTPUT"
          terraform -chdir=infra/envs/staging output -json mailer_lambda_function_names \
            > mailer-functions.json

      - name: Log in to ECR
        env:
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          # The registry host is everything before the first `/` of the repo URL.
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin "${REPO%%/*}"

      - name: Build and push image
        env:
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          # `sha-<sha>` is the immutable build identity — the tag a production
          # promotion resolves to a digest. `staging` is a MOVING marker tag
          # meaning "the image this environment currently runs"; it is what a
          # from-scratch `terraform apply` seeds the Lambda from
          # (var.image_tag). `:latest` is deliberately gone: the repository is
          # now shared with prod, where `latest` would mean "whatever any
          # environment pushed last".
          docker build --target lambda \
            -t "$REPO:sha-${{ github.sha }}" \
            -t "$REPO:staging" \
            services/mailer
          docker push "$REPO:sha-${{ github.sha }}"
          docker push "$REPO:staging"

      - name: Update Lambda code (ingress, sender, feedback)
        env:
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          # One image, three entrypoints — mailer-functions.json is the
          # {ingress, sender, feedback} map from mailer_lambda_function_names.
          # Loop rather than three copy-pasted steps so a fourth entrypoint
          # (should one ever exist) needs no workflow change.
          for function in $(jq -r '.[]' mailer-functions.json); do
            aws lambda update-function-code \
              --function-name "$function" \
              --image-uri "$REPO:sha-${{ github.sha }}"
          done
          for function in $(jq -r '.[]' mailer-functions.json); do
            aws lambda wait function-updated --function-name "$function"
          done

      - name: Smoke test
        env:
          DOMAIN: ${{ steps.tf.outputs.domain }}
        run: |
          # The mailer API is SigV4-authenticated end to end — even /health (it
          # has no unauthenticated route at all, unlike the API service). An
          # unsigned request should get exactly a 403 from API Gateway's IAM
          # authorizer, which is enough to prove the custom domain, DNS, and
          # Lambda are wired together; a real send-path smoke test needs a
          # signed request as the registered caller, which is PR4's job once
          # the API service has a mailer client.
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST "$DOMAIN/v1/services/insolvia_api/messages")"
          if [ "$status" != "403" ]; then
            echo "expected 403 (Forbidden — unsigned request) from $DOMAIN, got $status" >&2
            exit 1
          fi
