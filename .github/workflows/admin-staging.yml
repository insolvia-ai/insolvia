name: Admin · Deploy · Staging

# Steady-state deploy for the admin service (#213; the .NET host
# backend/src/Insolvia.Admin since the switch, ADR 0028) and the staff
# portal — the api-staging.yml shape, whose comments own the shared
# reasoning; only the paths differ. The migrator leg ran before it. The first
# deploy in a fresh environment needs the image-before-apply bootstrap
# (infra/modules/admin_service/main.tf header;
# scripts/bootstrap-ecr-images.sh staging admin).
#
# ── Job order: deploy → contract ─────────────────────────────────────────────
#
# `contract` runs contract/'s admin specs on the DEPLOYED target against the
# admin service now serving (ADR 0029 rule 2; api-staging.yml's `integration`
# job is the model and owns the shared reasoning). Admin is checked SIGNED
# OUT here, by decision: staff sign in through Google Workspace, whose `hd`
# claim no automatable identity carries (ADR 0029, "Staff sign-in is not
# automated on any deployed environment"). So it proves health, the portal's
# CORS, and that every route refuses both no credential and a seeded
# person's REAL Cognito token from staging's pool — ADR 0011 against the
# deployed configuration. The signed-in specs run offline on every PR. Its
# failure fails this workflow, and so the release's production stage.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  # The portal build installs @insolvia-ai/design-system from GitHub Packages.
  packages: read

concurrency:
  group: insolvia-terraform-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: insolvia-staging
    # Frozen for the contract job, so it never reads state that moved on.
    outputs:
      domain: ${{ steps.tf.outputs.domain }}
      api_domain: ${{ steps.tf.outputs.api_domain }}
      migrator_function: ${{ steps.tf.outputs.migrator_function }}
      auth_pool_id: ${{ steps.tf.outputs.auth_pool_id }}
      auth_client_id: ${{ steps.tf.outputs.auth_client_id }}
      auth_portal_client_id: ${{ steps.tf.outputs.auth_portal_client_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"
          # The wrapper interposes on stdout, which corrupts the
          # `terraform output -raw` command substitutions below.
          terraform_wrapper: false

      - name: Read staging infra outputs
        id: tf
        run: |
          terraform -chdir=infra/envs/staging init
          {
            echo "repo=$(terraform -chdir=infra/envs/staging output -raw admin_ecr_repository_url)"
            echo "function=$(terraform -chdir=infra/envs/staging output -raw admin_lambda_function_name)"
            echo "domain=$(terraform -chdir=infra/envs/staging output -raw admin_domain)"
            echo "alias=$(terraform -chdir=infra/envs/staging output -raw admin_lambda_alias_name)"
            echo "web_bucket=$(terraform -chdir=infra/envs/staging output -raw admin_web_bucket_name)"
            echo "web_dist=$(terraform -chdir=infra/envs/staging output -raw admin_web_distribution_id)"
            # The contract job's inputs (public values): the API whose /health
            # the suite checks before signing anyone in, the migrator the seed
            # step invokes, and the pool + clients the seeded people sign in to.
            echo "api_domain=$(terraform -chdir=infra/envs/staging output -raw api_domain)"
            echo "migrator_function=$(terraform -chdir=infra/envs/staging output -raw migrator_function_name)"
            echo "auth_pool_id=$(terraform -chdir=infra/envs/staging output -raw auth_user_pool_id)"
            echo "auth_client_id=$(terraform -chdir=infra/envs/staging output -raw auth_web_client_id)"
            echo "auth_portal_client_id=$(terraform -chdir=infra/envs/staging output -raw auth_portal_client_id)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        env:
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          # The registry host is everything before the first `/` of the repo URL.
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin "${REPO%%/*}"

      - name: Build and push image
        env:
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          # sha-<sha> is the immutable identity a production promotion resolves
          # to a digest; `staging` is this environment's moving marker tag.
          # Context is backend/ (backend/Dockerfile's header).
          docker build --target admin-lambda \
            -t "$REPO:sha-${{ github.sha }}" \
            -t "$REPO:staging" \
            backend
          docker push "$REPO:sha-${{ github.sha }}"
          docker push "$REPO:staging"

      - name: Update Lambda code
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          # Deliberately NOT --publish here — the next step rewrites the
          # environment from SSM first (api-staging.yml records why).
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --image-uri "$REPO:sha-${{ github.sha }}"
          aws lambda wait function-updated --function-name "$FUNCTION"

      - name: Re-derive Lambda environment from SSM
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
        run: |
          # /insolvia/staging/admin-api/<kebab-key> -> KEBAB_KEY, e.g.
          #   insolvia-db-username -> INSOLVIA_DB_USERNAME (= admin)
          #   google-client-id     -> GOOGLE_CLIENT_ID
          # plus /insolvia/staging/db/* as INSOLVIA_DB_*
          # (.github/scripts/lambda-environment.sh, which also refuses a
          # namespace whose INSOLVIA_ENV is not "staging").
          environment="$(.github/scripts/lambda-environment.sh staging admin-api --db --expect-env staging)"
          aws lambda update-function-configuration \
            --function-name "$FUNCTION" \
            --environment "$environment"
          aws lambda wait function-updated --function-name "$FUNCTION"

      - name: Publish version and shift the live alias
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
          ALIAS: ${{ steps.tf.outputs.alias }}
        run: |
          version="$(aws lambda publish-version \
            --function-name "$FUNCTION" \
            --query Version --output text)"
          aws lambda update-alias \
            --function-name "$FUNCTION" \
            --name "$ALIAS" \
            --function-version "$version"
          echo "Staging admin now serving version $version via alias $ALIAS." >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        env:
          DOMAIN: ${{ steps.tf.outputs.domain }}
        run: |
          curl -sSf "https://$DOMAIN/health" | tee health.json
          jq -e '.environment == "staging"' health.json > /dev/null

      # ── The portal (#215) ────────────────────────────────────────────────
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build the portal
        working-directory: apps/insolvia_admin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_INSOLVIA_ENV: staging
        run: |
          npm ci
          npm run build

      # Two-tier cache sync, the app workflow's shape (its comment owns the
      # argument): Vite's dist/assets are content-hashed — immutable forever;
      # index.html keeps its name while its bytes change — never cached.
      - name: Sync the portal to S3 + invalidate
        env:
          SRC: apps/insolvia_admin/dist
          BUCKET: ${{ steps.tf.outputs.web_bucket }}
          DIST: ${{ steps.tf.outputs.web_dist }}
        run: |
          set -euo pipefail
          aws s3 sync "$SRC/assets" "s3://$BUCKET/assets" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync "$SRC" "s3://$BUCKET" --exclude "assets/*" \
            --cache-control "no-cache,no-store,must-revalidate"
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"

      - name: Smoke test the portal
        run: |
          # Through CloudFront, retrying past the invalidation: the shell
          # must serve, carrying the app's title.
          curl -sSf --retry 5 --retry-delay 5 --retry-all-errors \
            "https://staging-admin.insolvia.ai/" | grep -q "Insolvia Admin"

  # ── Contract: the deployed admin service, signed out ───────────────────
  #
  # `environment: insolvia-staging` is load-bearing, as in api-staging.yml:
  # E2E_TEST_USER_PASSWORD is an environment secret, and the seed step
  # invokes the migrator with AWS_ROLE_ARN. The suite itself holds no AWS
  # credentials — SRP is unsigned Cognito calls, the rest HTTPS.
  contract:
    needs: deploy
    runs-on: ubuntu-latest
    environment: insolvia-staging
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      # The global setup signs in every person seeds/staging.json names, so
      # they must exist; converging is a fast no-op when the API leg already
      # seeded this release.
      - uses: ./.github/actions/seed-staging
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          migrator-function: ${{ needs.deploy.outputs.migrator_function }}

      # The root workspace's lockfile: contract/ goes through
      # @insolvia-ai/admin-client, a workspace member.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # src/admin only. CONTRACT_ADMIN_ORIGIN is the portal's own origin — the
      # one the smoke test above fetches, and the one AdminConfig admits for
      # staging. The offline-only specs are listed as skipped, by name.
      - name: Contract suite against staging admin (deployed target)
        env:
          CONTRACT_TARGET: deployed
          CONTRACT_ENVIRONMENT: staging
          CONTRACT_API_URL: https://${{ needs.deploy.outputs.api_domain }}
          CONTRACT_ADMIN_URL: https://${{ needs.deploy.outputs.domain }}
          CONTRACT_ADMIN_ORIGIN: https://staging-admin.insolvia.ai
          CONTRACT_AUTH_POOL_ID: ${{ needs.deploy.outputs.auth_pool_id }}
          CONTRACT_AUTH_CLIENT_ID: ${{ needs.deploy.outputs.auth_client_id }}
          CONTRACT_AUTH_PORTAL_CLIENT_ID: ${{ needs.deploy.outputs.auth_portal_client_id }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: npm run contract --workspace @insolvia-ai/contract -- src/admin
