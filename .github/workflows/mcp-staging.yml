name: MCP · Deploy · Staging

# Steady-state deploy for the MCP service (ADR 0016; the .NET host
# backend/src/Insolvia.Mcp since the switch, ADR 0028): push a fresh image
# (backend/Dockerfile's `mcp-lambda` target), point the Lambda at it,
# re-derive its environment from the /insolvia/staging/mcp SSM namespace and
# the database contract, smoke-test the endpoint. Same shape as
# api-staging.yml minus the worker half; the migrator leg ran before it.
#
# The FIRST deploy in a fresh environment cannot run through this workflow: an
# Image-package Lambda refuses to be created before its image exists, so the
# infra apply deadlocks. Bootstrap once by hand, per
# infra/modules/mcp_service/main.tf:
#   1. insolvia-services releases infra/envs/shared   (creates insolvia-shared-mcp-dotnet)
#   2. scripts/bootstrap-ecr-images.sh staging mcp
#   3. terraform apply   (full)
# After that, every deploy is this workflow.
#
# ── Job order: deploy → contract ─────────────────────────────────────────────
#
# `contract` runs contract/'s MCP specs on the DEPLOYED target against the
# server now serving (ADR 0029 rule 2; api-staging.yml's `integration` job is
# the model and owns the shared reasoning), through the official TypeScript
# SDK — the client an agent's harness runs — and SIGNED IN: the seeded firm
# admin signs in by SRP through the MCP Inspector's app client, which is on
# the server's allowlist (AUTH_CLIENT_IDS) and permits SRP (verified for
# #583). So it proves a real pool token verifies against the deployed
# allowlist, the role may make every read the tools make and write
# candidates, and the agent's proposal reaches the API's review queue. Its
# failure fails this workflow, and so the release's production stage.

on:
  # Reusable: release.yml calls this as one leg of a staging release, and it
  # stays dispatchable by hand for a single-service deploy.
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Held while this workflow deploys, shared with infra-staging.yml — same
# rationale as api-staging.yml's group.
concurrency:
  group: insolvia-terraform-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: insolvia-staging
    # Frozen for the contract job, so it never reads state that moved on.
    outputs:
      domain: ${{ steps.tf.outputs.domain }}
      api_domain: ${{ steps.tf.outputs.api_domain }}
      migrator_function: ${{ steps.tf.outputs.migrator_function }}
      auth_pool_id: ${{ steps.tf.outputs.auth_pool_id }}
      auth_client_id: ${{ steps.tf.outputs.auth_client_id }}
      auth_portal_client_id: ${{ steps.tf.outputs.auth_portal_client_id }}
      auth_mcp_client_id: ${{ steps.tf.outputs.auth_mcp_client_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"
          # The wrapper interposes on stdout, which corrupts the
          # `terraform output -raw` command substitutions below.
          terraform_wrapper: false

      - name: Read staging infra outputs
        id: tf
        run: |
          terraform -chdir=infra/envs/staging init
          {
            echo "repo=$(terraform -chdir=infra/envs/staging output -raw mcp_ecr_repository_url)"
            echo "function=$(terraform -chdir=infra/envs/staging output -raw mcp_lambda_function_name)"
            echo "domain=$(terraform -chdir=infra/envs/staging output -raw mcp_domain)"
            echo "alias=$(terraform -chdir=infra/envs/staging output -raw mcp_lambda_alias_name)"
            # The contract job's inputs (public values), as api-staging.yml
            # reads them, plus the MCP Inspector's client from the auth
            # contract insolvia-services publishes (/insolvia/staging/auth/*,
            # ADR 0026) — the client the seeded admin signs in through.
            echo "api_domain=$(terraform -chdir=infra/envs/staging output -raw api_domain)"
            echo "migrator_function=$(terraform -chdir=infra/envs/staging output -raw migrator_function_name)"
            echo "auth_pool_id=$(terraform -chdir=infra/envs/staging output -raw auth_user_pool_id)"
            echo "auth_client_id=$(terraform -chdir=infra/envs/staging output -raw auth_web_client_id)"
            echo "auth_portal_client_id=$(terraform -chdir=infra/envs/staging output -raw auth_portal_client_id)"
            echo "auth_mcp_client_id=$(aws ssm get-parameter --name /insolvia/staging/auth/mcp-client-ids --query Parameter.Value --output text | jq -er .inspector)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        env:
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin "${REPO%%/*}"

      - name: Build and push image
        env:
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          # `sha-<sha>` is the immutable build identity a production promotion
          # resolves to a digest; `staging` is the moving marker tag a
          # from-scratch apply seeds the Lambda from — api-staging.yml's
          # comment owns the full argument. Context is backend/: every .NET
          # host builds from its one Dockerfile.
          docker build --target mcp-lambda \
            -t "$REPO:sha-${{ github.sha }}" \
            -t "$REPO:staging" \
            backend
          docker push "$REPO:sha-${{ github.sha }}"
          docker push "$REPO:staging"

      - name: Update Lambda code
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          # No --publish: the next step rewrites the environment from SSM, and
          # a version published now would snapshot the OLD configuration.
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --image-uri "$REPO:sha-${{ github.sha }}"
          aws lambda wait function-updated --function-name "$FUNCTION"

      - name: Re-derive Lambda environment from SSM
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
        run: |
          # /insolvia/staging/mcp/<kebab-key> -> KEBAB_KEY:
          #   insolvia-env         -> INSOLVIA_ENV
          #   insolvia-db-username -> INSOLVIA_DB_USERNAME (= mcp)
          #   insolvia-cursor-key  -> INSOLVIA_CURSOR_KEY
          #   auth-issuer-url      -> AUTH_ISSUER_URL
          #   auth-client-ids      -> AUTH_CLIENT_IDS
          # plus /insolvia/staging/db/* as INSOLVIA_DB_*
          # (.github/scripts/lambda-environment.sh). Terraform ignores
          # `environment` drift on the Lambda — this step owns it.
          environment="$(.github/scripts/lambda-environment.sh staging mcp --db --expect-env staging)"
          echo "$environment" | jq -e '.Variables.AUTH_CLIENT_IDS | length > 0' > /dev/null
          aws lambda update-function-configuration \
            --function-name "$FUNCTION" \
            --environment "$environment"
          aws lambda wait function-updated --function-name "$FUNCTION"

      # Staging publishes and shifts in one go — it is the proving ground.
      # Production does the opposite (smoke-test first, shift after).
      - name: Publish version and shift the live alias
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
          ALIAS: ${{ steps.tf.outputs.alias }}
        run: |
          version="$(aws lambda publish-version \
            --function-name "$FUNCTION" \
            --query Version --output text)"
          aws lambda update-alias \
            --function-name "$FUNCTION" \
            --name "$ALIAS" \
            --function-version "$version"
          echo "Staging now serving version $version via alias $ALIAS." >> "$GITHUB_STEP_SUMMARY"

      # The MCP surface has no public /health — every tool is authenticated —
      # so the smoke test is the two unauthenticated facts the spec REQUIRES
      # this server to publish: the RFC 9728 protected-resource metadata, and
      # a 401 + WWW-Authenticate challenge from the MCP endpoint itself.
      # Together they prove the image boots, the SDK's routes mounted, the
      # custom domain resolves, and auth fails closed.
      - name: Smoke test
        env:
          DOMAIN: ${{ steps.tf.outputs.domain }}
        run: |
          curl -sSf "https://$DOMAIN/.well-known/oauth-protected-resource/mcp" | tee metadata.json
          jq -e --arg url "https://$DOMAIN/mcp" '.resource == $url' metadata.json > /dev/null
          jq -e '.authorization_servers | length == 1' metadata.json > /dev/null

          status="$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "https://$DOMAIN/mcp" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: tools/list' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28"}}}')"
          if [ "$status" != "401" ]; then
            echo "::error::Expected an unauthenticated tools/list to answer 401, got $status."
            exit 1
          fi

  # ── Contract: the deployed MCP server, signed in through the SDK ───────
  #
  # `environment: insolvia-staging` is load-bearing, as in api-staging.yml:
  # E2E_TEST_USER_PASSWORD is an environment secret, and the seed step
  # invokes the migrator with AWS_ROLE_ARN. The suite itself holds no AWS
  # credentials — SRP is unsigned Cognito calls, the rest HTTPS. Writes go to
  # a scratch case the suite deletes when the file ends.
  contract:
    needs: deploy
    runs-on: ubuntu-latest
    environment: insolvia-staging
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/seed-staging
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          migrator-function: ${{ needs.deploy.outputs.migrator_function }}

      # The root workspace's lockfile: contract/ pins @modelcontextprotocol/sdk
      # there, and installs the design-system packages from GitHub Packages.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # src/mcp only; it reaches the API too (a scratch case, the review
      # queue), so the API's inputs are here as well. The offline-only specs
      # are listed as skipped, by name.
      - name: Contract suite against staging MCP (deployed target)
        env:
          CONTRACT_TARGET: deployed
          CONTRACT_ENVIRONMENT: staging
          CONTRACT_API_URL: https://${{ needs.deploy.outputs.api_domain }}
          CONTRACT_MCP_URL: https://${{ needs.deploy.outputs.domain }}/mcp
          CONTRACT_AUTH_POOL_ID: ${{ needs.deploy.outputs.auth_pool_id }}
          CONTRACT_AUTH_CLIENT_ID: ${{ needs.deploy.outputs.auth_client_id }}
          CONTRACT_AUTH_PORTAL_CLIENT_ID: ${{ needs.deploy.outputs.auth_portal_client_id }}
          CONTRACT_AUTH_MCP_CLIENT_ID: ${{ needs.deploy.outputs.auth_mcp_client_id }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: npm run contract --workspace @insolvia-ai/contract -- src/mcp
