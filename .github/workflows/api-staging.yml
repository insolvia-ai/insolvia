name: API · Deploy · Staging

# Steady-state deploy: push fresh .NET images (backend/Dockerfile's `lambda`
# and `worker-lambda` targets — backend/src/Insolvia.Api and Insolvia.Worker,
# ADR 0028), point the Lambdas at them, re-derive their environment from SSM,
# smoke-test /health. The schema is already current: release.yml runs the
# migrator leg (migrator-staging.yml) BEFORE this one, so the alias below
# never shifts onto code ahead of its database. Dispatched by hand, run
# migrator-staging.yml first when the change carries a migration.
#
# The FIRST deploy in a fresh environment cannot run through this workflow: an
# Image-package Lambda refuses to be created before its image exists, so the
# apply deadlocks. Bootstrap once, per infra/modules/api_service/main.tf:
#   1. insolvia-services releases infra/envs/shared (the -dotnet repositories)
#   2. scripts/bootstrap-ecr-images.sh staging api worker
#   3. terraform apply   (full)
# After that, every deploy is this workflow.
#
# Deploy workflows are not required status checks, so — unlike the *-pr.yml
# gates — a `paths:` filter here is safe (same as app-staging.yml).
#
# ── Job order: deploy → integration ──────────────────────────────────────────
#
# `deploy` publishes, shifts the alias and smoke-tests /health. `integration`
# then re-converges staging's seed (accounts, firms, the fixture case — the
# migrator Lambda's `seed` command, .github/actions/seed-staging) and runs
# services/api/tests/integration against the live API as those people. Since
# the switch that suite is a black-box HTTP client of the .NET API: it
# imports nothing from services/api, so it is the same oracle it was —
# the same tier a developer runs against their dev stack with
# services/api/scripts/dev-test-integration.sh. It runs AFTER the shift, so it
# exercises the version now serving; staging is the proving ground and that
# window is accepted, exactly as app-staging.yml's e2e job accepts it. Its
# failure fails this workflow, which is what makes it gate the release's
# production stage (release.yml `needs`) and the verified-commit status.

on:
  # Reusable: release.yml calls this as one leg of a staging
  # release, and it stays dispatchable by hand for a single-service deploy.
  # The `push:` trigger moved to release.yml, which now owns both the
  # trigger and the path filtering for every staging deploy.
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Held while this workflow deploys, and shared with infra-staging.yml so a
# hand-dispatched single-service deploy cannot overlap a Terraform apply.
# release.yml deliberately declares NO group of its own: a group on both
# caller and callee deadlocks, and `needs` already orders the legs.
concurrency:
  group: insolvia-terraform-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: insolvia-staging
    # Frozen for the integration job, so it never reads state that moved on.
    outputs:
      domain: ${{ steps.tf.outputs.domain }}
      migrator_function: ${{ steps.tf.outputs.migrator_function }}
      auth_pool_id: ${{ steps.tf.outputs.auth_pool_id }}
      auth_client_id: ${{ steps.tf.outputs.auth_client_id }}
      auth_portal_client_id: ${{ steps.tf.outputs.auth_portal_client_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"
          # The wrapper interposes on stdout, which corrupts the
          # `terraform output -raw` command substitutions below.
          terraform_wrapper: false

      - name: Read staging infra outputs
        id: tf
        run: |
          terraform -chdir=infra/envs/staging init
          {
            echo "repo=$(terraform -chdir=infra/envs/staging output -raw api_ecr_repository_url)"
            echo "function=$(terraform -chdir=infra/envs/staging output -raw api_lambda_function_name)"
            echo "domain=$(terraform -chdir=infra/envs/staging output -raw api_domain)"
            echo "alias=$(terraform -chdir=infra/envs/staging output -raw api_lambda_alias_name)"
            echo "jobs_repo=$(terraform -chdir=infra/envs/staging output -raw jobs_ecr_repository_url)"
            echo "worker_function=$(terraform -chdir=infra/envs/staging output -raw jobs_worker_function_name)"
            # The integration job's inputs: the migrator the seed step
            # invokes, and the pool + client the suite signs in against
            # (public values).
            echo "migrator_function=$(terraform -chdir=infra/envs/staging output -raw migrator_function_name)"
            echo "auth_pool_id=$(terraform -chdir=infra/envs/staging output -raw auth_user_pool_id)"
            echo "auth_client_id=$(terraform -chdir=infra/envs/staging output -raw auth_web_client_id)"
            # The client portal's app client (ADR 0023): the seeded client
            # signs in against it, and staff routes must refuse its token.
            echo "auth_portal_client_id=$(terraform -chdir=infra/envs/staging output -raw auth_portal_client_id)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        env:
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          # The registry host is everything before the first `/` of the repo URL.
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin "${REPO%%/*}"

      - name: Build and push image
        env:
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          # `sha-<sha>` is the immutable build identity — the tag a production
          # promotion resolves to a digest. `staging` is a MOVING marker tag
          # meaning "the image this environment currently runs"; it is what a
          # from-scratch `terraform apply` seeds the Lambda from
          # (var.image_tag). `:latest` is deliberately gone: the repository is
          # shared with prod, where `latest` would mean "whatever any
          # environment pushed last".
          # Context is backend/ (backend/Dockerfile's header): one build stage
          # compiles every host, each target copies one out.
          docker build --target lambda \
            -t "$REPO:sha-${{ github.sha }}" \
            -t "$REPO:staging" \
            backend
          docker push "$REPO:sha-${{ github.sha }}"
          docker push "$REPO:staging"

      # The pipeline worker's image (ADR 0018): same Dockerfile, same backend/
      # context, the `worker-lambda` target, its own shared repository
      # (insolvia-shared-worker-dotnet). The build stage is cached from the
      # step above, so this is cheap — and it keeps the api and worker images
      # of one commit in lockstep, which the unknown-kind window depends on
      # being short.
      - name: Build and push worker image
        env:
          JOBS_REPO: ${{ steps.tf.outputs.jobs_repo }}
        run: |
          docker build --target worker-lambda \
            -t "$JOBS_REPO:sha-${{ github.sha }}" \
            -t "$JOBS_REPO:staging" \
            backend
          docker push "$JOBS_REPO:sha-${{ github.sha }}"
          docker push "$JOBS_REPO:staging"

      - name: Update Lambda code
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          # Deliberately NOT --publish here. The next step rewrites the
          # function's environment from SSM, and a version published now would
          # snapshot the OLD environment — the alias would then serve code with
          # stale config. Publish happens after the configuration is settled.
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --image-uri "$REPO:sha-${{ github.sha }}"
          aws lambda wait function-updated --function-name "$FUNCTION"

      - name: Re-derive Lambda environment from SSM
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # /insolvia/staging/api/<kebab-key> -> KEBAB_KEY (insolvia-env ->
          # INSOLVIA_ENV, insolvia-db-username -> INSOLVIA_DB_USERNAME, …)
          # plus the database contract /insolvia/staging/db/* as
          # INSOLVIA_DB_* — .github/scripts/lambda-environment.sh, the one
          # derivation every backend deploy uses. It refuses an empty or
          # half-applied namespace (INSOLVIA_ENV must read "staging") and any
          # Lambda-reserved name. Terraform ignores `environment` drift on the
          # Lambda (infra/modules/api_service/main.tf) — this step owns it.
          environment="$(.github/scripts/lambda-environment.sh staging api --db --expect-env staging)"
          # The Anthropic key rides a GitHub environment secret, not SSM —
          # the founder's choice (2026-09-05): pasted once into the
          # environment, overlaid here onto the derived namespace. Empty
          # secret = variable absent = the worker composes no ReviewModel
          # and AI jobs fail honestly with not_configured.
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            environment="$(echo "$environment" | jq -c --arg v "$ANTHROPIC_API_KEY" '.Variables.ANTHROPIC_API_KEY = $v')"
          fi
          aws lambda update-function-configuration \
            --function-name "$FUNCTION" \
            --environment "$environment"
          aws lambda wait function-updated --function-name "$FUNCTION"

      # Code and configuration are both settled, so this snapshot is coherent.
      # Staging publishes and shifts in one go — it is the proving ground, and
      # a failed smoke test below turns the run red. Production deliberately
      # does the opposite (smoke-test the new version FIRST, shift only on
      # success), so a bad build never reaches live traffic there.
      - name: Publish version and shift the live alias
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
          ALIAS: ${{ steps.tf.outputs.alias }}
        run: |
          version="$(aws lambda publish-version \
            --function-name "$FUNCTION" \
            --query Version --output text)"
          aws lambda update-alias \
            --function-name "$FUNCTION" \
            --name "$ALIAS" \
            --function-version "$version"
          echo "Staging now serving version $version via alias $ALIAS." >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        env:
          DOMAIN: ${{ steps.tf.outputs.domain }}
        run: |
          curl -sSf "https://$DOMAIN/health" | tee health.json
          jq -e '.environment == "staging"' health.json > /dev/null

      # ── The pipeline worker (ADR 0018) ──────────────────────────
      # Rolled after the API is serving, in the same run: no alias, no
      # version dance — a queue consumer has no router to protect
      # (modules/job_pipeline owns that argument), so this is
      # update-code, re-derive env, and a direct smoke invocation.
      - name: Update worker code
        env:
          WORKER: ${{ steps.tf.outputs.worker_function }}
          JOBS_REPO: ${{ steps.tf.outputs.jobs_repo }}
        run: |
          aws lambda update-function-code \
            --function-name "$WORKER" \
            --image-uri "$JOBS_REPO:sha-${{ github.sha }}"
          aws lambda wait function-updated --function-name "$WORKER"

      - name: Re-derive worker environment from SSM
        env:
          WORKER: ${{ steps.tf.outputs.worker_function }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # The worker's OWN namespace, /insolvia/staging/worker — not the
          # API's, since the switch: the two log in as different Postgres
          # roles (INSOLVIA_DB_USERNAME worker vs api). Plus /db/*.
          environment="$(.github/scripts/lambda-environment.sh staging worker --db --expect-env staging)"
          # The Anthropic key rides a GitHub environment secret, not SSM —
          # the founder's choice (2026-09-05): pasted once into the
          # environment, overlaid here onto the derived namespace. Empty
          # secret = variable absent = the worker composes no ReviewModel
          # and AI jobs fail honestly with not_configured (WorkerHost.cs).
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            environment="$(echo "$environment" | jq -c --arg v "$ANTHROPIC_API_KEY" '.Variables.ANTHROPIC_API_KEY = $v')"
          fi
          aws lambda update-function-configuration \
            --function-name "$WORKER" \
            --environment "$environment"
          aws lambda wait function-updated --function-name "$WORKER"

      # A synthetic SQS event whose job id has no record: the worker logs and
      # drops it by design (JobDispatch.RunJobAsync), so a clean (no
      # FunctionError) return proves the image boots, the handler resolves,
      # and Aurora answers a SELECT as the `worker` role through the VPC —
      # the network, the IAM token and the grant, all at once — without
      # writing anything.
      - name: Smoke test the worker
        env:
          WORKER: ${{ steps.tf.outputs.worker_function }}
        run: |
          cat > worker-event.json <<'EOF'
          {
            "Records": [
              {
                "body": "{\"version\":1,\"jobId\":\"00000000-0000-4000-8000-00000000smoke\",\"caseId\":\"00000000-0000-4000-8000-00000000smoke\",\"kind\":\"echo\"}"
              }
            ]
          }
          EOF
          aws lambda invoke \
            --function-name "$WORKER" \
            --payload fileb://worker-event.json \
            --cli-read-timeout 120 \
            worker-response.json > worker-invoke-meta.json
          cat worker-invoke-meta.json
          if jq -e '.FunctionError' worker-invoke-meta.json > /dev/null; then
            echo "::error::Worker smoke invocation raised: $(jq -r '.FunctionError' worker-invoke-meta.json)"
            cat worker-response.json
            exit 1
          fi

  # ── Integration: the live API, signed in as the seeded people ──────────
  #
  # THIS IS WHAT MAKES THE API LEG ASSERT BEHAVIOUR. /health proves the
  # function booted; this proves a real token from the real pool verifies
  # against the deployed configuration, that the Lambda's own execution role
  # may make every call the routes make (Aurora as `api`, KMS, S3 — the one thing
  # no test on a laptop can exercise, because a developer's credentials are
  # wider than the role's), that the bucket policy admits the presigned PUT
  # the API mints, and that ADR 0009's refusals hold from outside.
  #
  # `environment: insolvia-staging` is load-bearing: AWS_ROLE_ARN (the seed
  # action invokes the migrator with it) and E2E_TEST_USER_PASSWORD live
  # there. No AWS credentials reach the suite itself — sign-in is SRP over
  # unsigned Cognito calls and everything after is HTTPS to the API.
  integration:
    needs: deploy
    runs-on: ubuntu-latest
    environment: insolvia-staging
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/seed-staging
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          migrator-function: ${{ needs.deploy.outputs.migrator_function }}

      # The suite's own pins. It imports nothing from services/api's source —
      # it is an HTTP client — but runs under the pytest the Python unit tier
      # pins. TRANSITIONAL: 18.23 deletes services/api, and this tier moves
      # with it (the contract suite, contract/, is the .NET-era successor).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the integration tier's test toolchain
        run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: services/api

      - name: Integration tier against staging
        working-directory: services/api
        env:
          INSOLVIA_INTEGRATION: "1"
          INTEGRATION_TARGET: staging
          INTEGRATION_API_URL: https://${{ needs.deploy.outputs.domain }}
          INTEGRATION_AUTH_POOL_ID: ${{ needs.deploy.outputs.auth_pool_id }}
          INTEGRATION_AUTH_CLIENT_ID: ${{ needs.deploy.outputs.auth_client_id }}
          INTEGRATION_AUTH_PORTAL_CLIENT_ID: ${{ needs.deploy.outputs.auth_portal_client_id }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: pytest tests/integration
