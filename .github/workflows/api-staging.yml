name: API · Deploy · Staging

# Steady-state deploy: apply the env, push a fresh image, point the Lambda at
# it, re-derive its environment from SSM, smoke-test /health.
#
# The FIRST deploy in a fresh environment cannot run through this workflow: an
# Image-package Lambda refuses to be created before its image exists, so the
# apply below deadlocks. Bootstrap once by hand, per
# infra/modules/api_service/main.tf:
#   1. terraform -chdir=infra/envs/shared apply   (creates insolvia-shared-api)
#   2. docker build --target lambda (repo-root context, -f services/api/Dockerfile), tag <repo-url>:staging, push
#   3. terraform apply   (full)
# After that, every deploy is this workflow.
#
# Deploy workflows are not required status checks, so — unlike the *-pr.yml
# gates — a `paths:` filter here is safe (same as app-staging.yml).

on:
  # Reusable: release.yml calls this as one leg of a staging
  # release, and it stays dispatchable by hand for a single-service deploy.
  # The `push:` trigger moved to release.yml, which now owns both the
  # trigger and the path filtering for every staging deploy.
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Held while this workflow deploys, and shared with infra-staging.yml so a
# hand-dispatched single-service deploy cannot overlap a Terraform apply.
# release.yml deliberately declares NO group of its own: a group on both
# caller and callee deadlocks, and `needs` already orders the legs.
concurrency:
  group: insolvia-terraform-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: insolvia-staging
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"
          # The wrapper interposes on stdout, which corrupts the
          # `terraform output -raw` command substitutions below.
          terraform_wrapper: false

      - name: Read staging infra outputs
        id: tf
        run: |
          terraform -chdir=infra/envs/staging init
          {
            echo "repo=$(terraform -chdir=infra/envs/staging output -raw api_ecr_repository_url)"
            echo "function=$(terraform -chdir=infra/envs/staging output -raw api_lambda_function_name)"
            echo "domain=$(terraform -chdir=infra/envs/staging output -raw api_domain)"
            echo "alias=$(terraform -chdir=infra/envs/staging output -raw api_lambda_alias_name)"
            echo "jobs_repo=$(terraform -chdir=infra/envs/staging output -raw jobs_ecr_repository_url)"
            echo "worker_function=$(terraform -chdir=infra/envs/staging output -raw jobs_worker_function_name)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        env:
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          # The registry host is everything before the first `/` of the repo URL.
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin "${REPO%%/*}"

      - name: Build and push image
        env:
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          # `sha-<sha>` is the immutable build identity — the tag a production
          # promotion resolves to a digest. `staging` is a MOVING marker tag
          # meaning "the image this environment currently runs"; it is what a
          # from-scratch `terraform apply` seeds the Lambda from
          # (var.image_tag). `:latest` is deliberately gone: the repository is
          # now shared with prod, where `latest` would mean "whatever any
          # environment pushed last".
          # Context is the repo root: the image installs the shared
          # packages/insolvia_core by relative path (see the Dockerfile header).
          docker build --target lambda -f services/api/Dockerfile \
            -t "$REPO:sha-${{ github.sha }}" \
            -t "$REPO:staging" \
            .
          docker push "$REPO:sha-${{ github.sha }}"
          docker push "$REPO:staging"

      # The pipeline worker's image (ADR 0018): same Dockerfile, same repo-root
      # context, the `worker` target, its own shared repository. Nearly every
      # layer is shared with the build above, so this is cheap — and it keeps
      # the api and worker images of one commit in lockstep, which run_job's
      # unknown-kind window depends on being short.
      - name: Build and push worker image
        env:
          JOBS_REPO: ${{ steps.tf.outputs.jobs_repo }}
        run: |
          docker build --target worker -f services/api/Dockerfile \
            -t "$JOBS_REPO:sha-${{ github.sha }}" \
            -t "$JOBS_REPO:staging" \
            .
          docker push "$JOBS_REPO:sha-${{ github.sha }}"
          docker push "$JOBS_REPO:staging"

      - name: Update Lambda code
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          # Deliberately NOT --publish here. The next step rewrites the
          # function's environment from SSM, and a version published now would
          # snapshot the OLD environment — the alias would then serve code with
          # stale config. Publish happens after the configuration is settled.
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --image-uri "$REPO:sha-${{ github.sha }}"
          aws lambda wait function-updated --function-name "$FUNCTION"

      - name: Re-derive Lambda environment from SSM
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
        run: |
          # /insolvia/staging/api/<kebab-key> -> KEBAB_KEY:
          #   insolvia-env        -> INSOLVIA_ENV
          #   waitlist-table-name -> WAITLIST_TABLE_NAME
          # Terraform ignores `environment` drift on the Lambda (see
          # infra/modules/api_service/main.tf) — this step owns it.
          environment="$(
            aws ssm get-parameters-by-path \
              --path /insolvia/staging/api \
              --with-decryption \
              --query 'Parameters[].{Name:Name,Value:Value}' \
              --output json \
            | jq -c 'map({key: (.Name | split("/") | last | ascii_upcase | gsub("-"; "_")), value: .Value})
                     | {Variables: from_entries}'
          )"
          # Refuse to ship nonsense: an empty or half-applied namespace would
          # otherwise silently wipe every variable the service reads.
          echo "$environment" | jq -e '.Variables.INSOLVIA_ENV == "staging"' > /dev/null
          aws lambda update-function-configuration \
            --function-name "$FUNCTION" \
            --environment "$environment"
          aws lambda wait function-updated --function-name "$FUNCTION"

      # Code and configuration are both settled, so this snapshot is coherent.
      # Staging publishes and shifts in one go — it is the proving ground, and
      # a failed smoke test below turns the run red. Production deliberately
      # does the opposite (smoke-test the new version FIRST, shift only on
      # success), so a bad build never reaches live traffic there.
      - name: Publish version and shift the live alias
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
          ALIAS: ${{ steps.tf.outputs.alias }}
        run: |
          version="$(aws lambda publish-version \
            --function-name "$FUNCTION" \
            --query Version --output text)"
          aws lambda update-alias \
            --function-name "$FUNCTION" \
            --name "$ALIAS" \
            --function-version "$version"
          echo "Staging now serving version $version via alias $ALIAS." >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        env:
          DOMAIN: ${{ steps.tf.outputs.domain }}
        run: |
          curl -sSf "https://$DOMAIN/health" | tee health.json
          jq -e '.environment == "staging"' health.json > /dev/null

      # ── The pipeline worker (ADR 0018) ──────────────────────────
      # Rolled after the API is serving, in the same run: no alias, no
      # version dance — a queue consumer has no router to protect
      # (modules/job_pipeline owns that argument), so this is
      # update-code, re-derive env, and a direct smoke invocation.
      - name: Update worker code
        env:
          WORKER: ${{ steps.tf.outputs.worker_function }}
          JOBS_REPO: ${{ steps.tf.outputs.jobs_repo }}
        run: |
          aws lambda update-function-code \
            --function-name "$WORKER" \
            --image-uri "$JOBS_REPO:sha-${{ github.sha }}"
          aws lambda wait function-updated --function-name "$WORKER"

      - name: Re-derive worker environment from SSM
        env:
          WORKER: ${{ steps.tf.outputs.worker_function }}
        run: |
          # The SAME /insolvia/staging/api namespace as the API Lambda — the
          # worker is the API's long-running half and reads the same config
          # (CASE_TABLE_NAME is what it actually needs; the extras are
          # harmless and keep this step one derivation, not two).
          environment="$(
            aws ssm get-parameters-by-path \
              --path /insolvia/staging/api \
              --with-decryption \
              --query 'Parameters[].{Name:Name,Value:Value}' \
              --output json \
            | jq -c 'map({key: (.Name | split("/") | last | ascii_upcase | gsub("-"; "_")), value: .Value})
                     | {Variables: from_entries}'
          )"
          echo "$environment" | jq -e '.Variables.INSOLVIA_ENV == "staging"' > /dev/null
          aws lambda update-function-configuration \
            --function-name "$WORKER" \
            --environment "$environment"
          aws lambda wait function-updated --function-name "$WORKER"

      # A synthetic SQS event whose job id has no record: run_job logs and
      # drops it by design, so a clean (no FunctionError) return proves the
      # image boots, the handler resolves, and the store is reachable —
      # without writing anything.
      - name: Smoke test the worker
        env:
          WORKER: ${{ steps.tf.outputs.worker_function }}
        run: |
          cat > worker-event.json <<'EOF'
          {
            "Records": [
              {
                "body": "{\"version\":1,\"jobId\":\"00000000-0000-4000-8000-00000000smoke\",\"caseId\":\"00000000-0000-4000-8000-00000000smoke\",\"kind\":\"echo\"}"
              }
            ]
          }
          EOF
          aws lambda invoke \
            --function-name "$WORKER" \
            --payload fileb://worker-event.json \
            --cli-read-timeout 120 \
            worker-response.json > worker-invoke-meta.json
          cat worker-invoke-meta.json
          if jq -e '.FunctionError' worker-invoke-meta.json > /dev/null; then
            echo "::error::Worker smoke invocation raised: $(jq -r '.FunctionError' worker-invoke-meta.json)"
            cat worker-response.json
            exit 1
          fi
