name: API client · PR

# No `on.pull_request.paths:` filter, deliberately — see
# `.github/actions/changed-paths/action.yml`. The job below is a required status
# check on `protect-main`, so it must trigger and report on *every* PR; the
# `steps.filter` guard is what keeps an unrelated PR cheap. Re-adding a
# `paths:` filter would silently deadlock every PR that does not touch these
# paths.
#
# The ruleset matches required checks by EXACT NAME — renaming the `API client`
# job would silently orphan the gate. Use the `insolvia-branch-protection`
# skill for any ruleset change; do not hand-roll the `gh api` call, which
# replaces the arrays it is sent.
on:
  pull_request:

permissions:
  contents: read

jobs:
  api-client:
    name: API client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the guard can diff against the PR base commit.
          fetch-depth: 0

      - id: filter
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            packages/insolvia_api_client/**
            package.json
            package-lock.json
            tsconfig.base.json
            eslint.base.js
            .prettierrc
            .prettierignore
            .github/workflows/api-client-pr.yml
            .github/actions/changed-paths/action.yml

      # Must match the root package.json's `engines.node` (">=24"). There is
      # no `cache-dependency-path` here, unlike marketing-pr.yml: this package
      # is an npm *workspace member*, so the lockfile it installs from is the
      # repo-root one setup-node already looks for by default.
      - uses: actions/setup-node@v5
        if: steps.filter.outputs.run == 'true'
        with:
          node-version: "24"
          cache: npm

      # `ci`, never `install`: the lockfile is committed precisely so CI
      # resolves the same tree twice running, and `ci` fails loudly when
      # package.json and the lockfile have drifted apart. Run from the repo
      # root — it installs every workspace member and links them into
      # node_modules/@insolvia-ai, which is how the test below resolves
      # `@insolvia-ai/api-client`.
      - name: Install
        if: steps.filter.outputs.run == 'true'
        run: npm ci

      # Scoped to this package, not the repo. The root `lint`/`format` scripts
      # cover every workspace member, and this gate must not go red because a
      # *different* package has a lint error — that package has its own gate.
      - name: Format check
        if: steps.filter.outputs.run == 'true'
        run: npx prettier --check packages/insolvia_api_client

      # Run via the package's own script, not `npx eslint <path>` from the root:
      # there is deliberately no `eslint.config.js` at the repo root (see
      # eslint.base.js), so ESLint invoked with the root as its cwd would find
      # no config at all.
      - name: Lint
        if: steps.filter.outputs.run == 'true'
        run: npm run lint --workspace @insolvia-ai/api-client

      # `tsc` with the root tsconfig.base.json's `erasableSyntaxOnly`, which is
      # the only thing standing between this package and a runtime failure:
      # there is no build step, so Node and Metro consume src/*.ts directly and
      # cannot execute `enum`, `namespace`, or parameter properties.
      - name: Typecheck
        if: steps.filter.outputs.run == 'true'
        run: npm run typecheck --workspace @insolvia-ai/api-client

      # The contract pin for services/api — see the header comment in
      # packages/insolvia_api_client/src/index.test.ts.
      - name: Test
        if: steps.filter.outputs.run == 'true'
        run: npm run test --workspace @insolvia-ai/api-client
