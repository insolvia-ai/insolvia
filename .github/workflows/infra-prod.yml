name: Infra · Terraform · Production

# Terraform for infra/envs/prod — the ONLY thing that applies it.
#
# The prod deploy workflows (api-prod, mailer-prod, marketing-prod, app-prod)
# deliberately apply no Terraform; they only read outputs. infra/envs/prod is
# one root module with one state and `terraform apply` reconciles all of it,
# so coupling an apply to a service deploy would cut both ways: an infra-only
# change would need a *service* deploy to carry it (redeploying a Lambda as a
# side effect), and a single-service deploy could drag unrelated infra changes
# into production with it.
#
# TWO WAYS IN, ONE CODE PATH — the same shape as infra-staging.yml:
#   • `workflow_call` from release.yml with `mode: apply`, as the FIRST job of
#     an approved production promotion. The service legs read Terraform
#     outputs, so infra goes first for the same reason it goes first on
#     staging; and the apply sits behind the release's `insolvia-production`
#     approval, for the exact commit staging just validated — the approval is
#     the deliberate act. `gated: true` says that approval already happened.
#   • `workflow_dispatch` by hand, defaulting to `mode: plan` — the only way
#     to see a plan against real prod state before anything applies
#     (shared-infra-plan.yml validates offline, with no credentials), and the
#     escape hatch for applying prod infra outside a release.
#
# WHY `plan` IS THE DISPATCH DEFAULT
# shared-infra-plan.yml catches syntax and type errors but can never show what
# a change would DO to real prod state. Without a plan mode, the first sight of
# a prod plan is the log of the apply that already ran. Fine for a routine
# change; not fine for a provider major-version bump or anything that might
# replace a resource. `infra-staging.yml` defaults to `plan` for the same
# reason.
#
# The `approve` gate covers BOTH dispatch modes, including the read-only plan:
# prod state carries SecureString values and the plan is written verbatim to
# the job summary, so even reading it is gated.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (read-only, writes the plan to the job summary) or apply"
        type: choice
        options: [plan, apply]
        default: plan
        required: true

  # Called by release.yml as the first job of its production stage.
  workflow_call:
    inputs:
      mode:
        description: "plan or apply"
        type: string
        default: apply
        required: false
      gated:
        description: "The caller already holds this run's insolvia-production approval — do not ask for a second one."
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  # The human gate, and ONLY for a direct dispatch: release.yml already put
  # its own approval in front of the whole production stage and says so with
  # `gated: true`. (`inputs.gated` is absent on a plain dispatch, so the
  # comparison reads null there — which is not true, and the gate runs.)
  approve:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gated != true }}
    runs-on: ubuntu-latest
    environment: insolvia-production
    steps:
      - run: echo "Terraform ${{ inputs.mode }} against infra/envs/prod approved."

  # `!cancelled() && !failure()` rather than the default `success()`: when the
  # release pipeline calls this, `approve` is SKIPPED, and the default would
  # silently skip the job behind it. A failed or rejected gate still stops it.
  terraform:
    needs: approve
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    # MUST match the group the prod deploy jobs hold. Only this workflow
    # applies, so the group does not guard apply-against-apply — it guards
    # apply-against-DEPLOY: an apply that lands while a service deploy is
    # mid-promotion could rewrite a Lambda's configuration underneath it, or
    # move an alias the deploy is about to shift. Native S3 state locking
    # (use_lockfile, enabled in #117) still backstops any apply that slips
    # past the group. Job-level, not workflow-level, so a dispatch parked at
    # `approve` holds nothing.
    #
    # release.yml deliberately declares NO group of its own — a group on both
    # the caller and the callee deadlocks the callee behind its own parent.
    concurrency:
      group: insolvia-terraform-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false

      - name: Init
        run: terraform -chdir=infra/envs/prod init -input=false

      - name: Plan
        if: inputs.mode == 'plan'
        run: |
          set -o pipefail
          terraform -chdir=infra/envs/prod plan -input=false -no-color \
            | tee plan.txt
          {
            echo '## Terraform plan — infra/envs/prod'
            echo
            echo '```terraform'
            # The summary has a 1 MiB cap; a plan large enough to hit it is
            # already a plan nobody should be reading in a browser.
            head -c 900000 plan.txt
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: inputs.mode == 'apply'
        run: terraform -chdir=infra/envs/prod apply -auto-approve -input=false

      - name: Outputs
        if: inputs.mode == 'apply'
        run: |
          {
            echo '## Outputs — infra/envs/prod'
            echo
            echo '```'
            terraform -chdir=infra/envs/prod output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
