name: Infra · Terraform · Staging

# Terraform for infra/envs/staging — the ONLY thing that applies it, exactly as
# infra-prod.yml is the only thing that applies prod.
#
# This is the direct counterpart of infra-prod.yml. It used to say the opposite,
# because staging's four service workflows each applied this root module
# themselves before deploying. release-staging.yml removed that: the service
# workflows now only `init` and read outputs, and this workflow owns the apply.
#
# TWO WAYS IN, ONE CODE PATH
#   • `workflow_call` from release-staging.yml with `mode: apply` — the first
#     job of every staging release, ordered ahead of the service legs because
#     they read the outputs it produces.
#   • `workflow_dispatch` by hand, defaulting to `mode: plan`.
#
# WHY `plan` IS THE DEFAULT, AND WHY IT MATTERS
# shared-infra-plan.yml validates every env offline (`init -backend=false`, no
# credentials), so it catches syntax and type errors but can never show what a
# change would DO to real staging state. Without a plan mode, the first sight of
# a staging plan is the log of the apply that already ran. Fine for a routine
# change; not fine for a provider major-version bump or anything that might
# replace a resource. `infra-prod.yml` defaults to `plan` for the same reason.
#
# THE ONE ASYMMETRY WITH PROD, AND ITS REASON
# release-staging.yml calls this workflow; release-prod.yml deliberately does
# NOT call infra-prod.yml. Staging IS `main`, so reconciling its infrastructure
# on every merge is the definition being enforced. Production is a promotion, so
# an automatic apply would let a code release carry unrelated infra drift into
# prod — there it stays a separate, deliberate act.

on:
  # Dispatched by hand for a plan; called by release-staging.yml with
  # `mode: apply` as the first job of every staging release. One code path
  # either way, exactly as the prod workflows are reusable for release-prod.yml.
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (read-only, writes the plan to the job summary) or apply"
        type: choice
        options: [plan, apply]
        default: plan
        required: true
  workflow_call:
    inputs:
      mode:
        description: "plan or apply"
        type: string
        default: apply
        required: false

permissions:
  id-token: write
  contents: read

# MUST match the group the staging service workflows hold. Nothing but this
# workflow applies the root module any more, so the group is not guarding
# apply-against-apply; it guards apply-against-DEPLOY — an apply landing while a
# hand-dispatched service deploy is mid-flight could rewrite a Lambda's
# configuration underneath it. Same reasoning as infra-prod.yml's group.
#
# release-staging.yml deliberately declares NO group of its own: a group on both
# the caller and the callee deadlocks the callee behind its own parent, and
# `needs` already orders the legs.
concurrency:
  group: insolvia-terraform-staging
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    # Environment-scoped secrets are invisible to a job that does not declare
    # an environment — AWS_ROLE_ARN would resolve to an empty string and the
    # OIDC step would fail with an unhelpful error.
    environment: insolvia-staging
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false

      - name: Init
        run: terraform -chdir=infra/envs/staging init -input=false

      - name: Plan
        if: inputs.mode == 'plan'
        run: |
          set -o pipefail
          terraform -chdir=infra/envs/staging plan -input=false -no-color \
            | tee plan.txt
          {
            echo '## Terraform plan — infra/envs/staging'
            echo
            echo '```terraform'
            # The summary has a 1 MiB cap; a plan large enough to hit it is
            # already a plan nobody should be reading in a browser.
            head -c 900000 plan.txt
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: inputs.mode == 'apply'
        run: terraform -chdir=infra/envs/staging apply -auto-approve -input=false

      - name: Outputs
        if: inputs.mode == 'apply'
        run: |
          {
            echo '## Outputs — infra/envs/staging'
            echo
            echo '```'
            terraform -chdir=infra/envs/staging output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
