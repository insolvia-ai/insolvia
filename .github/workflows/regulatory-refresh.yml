name: Regulatory data · refresh check

# The scheduled tripwire for the UST means-testing datasets and the § 104
# dollar-amount horizon (issue #99; effective-dating.md "The refresh
# process"). The UST tool's `check` command (backend/src/Insolvia.UstTool,
# .NET on the engine itself — ADR 0029 rule 4) compares the UST's current
# period against the committed registry; a difference means the product
# would compute means tests on stale data, so the failure must reach a
# HUMAN — this workflow opens (or comments on) a tracking issue rather than
# dying in a log. It runs identically on a developer machine:
# `dotnet run --project backend/src/Insolvia.UstTool -- check`.
#
# Weekly is deliberate: the UST posts 2-4 updates a year with effective
# dates weeks out, so a week's detection latency still leaves time to ingest
# before the data takes effect.

on:
  schedule:
    # Mondays 12:07 UTC — an off-minute, per GitHub's guidance to avoid the
    # top-of-hour thundering herd on scheduled workflows.
    - cron: "7 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: UST datasets current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          # The exact SDK backend/global.json pins, so CI and a laptop agree.
          global-json-file: backend/global.json

      # Built in its own step, so the check's log (which becomes the issue
      # body) is the tool's output alone. A build failure fails the job, and
      # the next step alerts on it like any other failure to verify.
      - name: Build the UST tool
        env:
          DOTNET_NOLOGO: 'true'
          DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
        run: |
          dotnet restore backend/src/Insolvia.UstTool --locked-mode
          dotnet build backend/src/Insolvia.UstTool --configuration Release --no-restore

      - name: Check the UST means-testing data against the registry
        id: check
        env:
          DOTNET_NOLOGO: 'true'
          DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
        run: |
          set +e
          dotnet run --project backend/src/Insolvia.UstTool --configuration Release --no-build -- check 2>&1 | tee check.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Alert a human
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Regulatory data staleness: UST means-testing datasets"
          body="$(printf 'The UST tool'"'"'s check failed on %s (run %s).\n\n```\n%s\n```\n\nIngest with the UST tool (backend/src/Insolvia.UstTool, see scripts/README.md) and open a release PR — see docs/reference/effective-dating.md, "The refresh process".' \
            "$(date -u +%Y-%m-%d)" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "$(cat check.log)")"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
