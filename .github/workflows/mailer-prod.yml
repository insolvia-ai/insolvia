name: Mailer · Deploy · Production

# PROMOTES the image staging validated — it does not build one. The shared
# insolvia-shared-mailer repository (infra/envs/shared) already holds the image
# staging tested, tagged `sha-<commit>`; this workflow resolves it to an
# immutable digest and points all three mailer Lambdas
# (ingress/sender/feedback — one image, three entrypoints) at it.
#
# THE NORMAL WAY IN is release.yml: its production stage calls this after its
# own staging stage went green and its single `insolvia-production` approval
# was given, passing `gated: true` so this workflow does not ask for a second
# approval. Dispatching this BY HAND is the exception — a single-service
# emergency deploy — and that path brings its own two gates: the
# `insolvia/staging-release` commit status check in `resolve`
# (.github/actions/verified-commit), before the approval, and the
# `insolvia-production` environment approval in `approve`.
#
# Unlike api-prod.yml there is no "re-derive Lambda environment from SSM" step:
# every mailer Lambda's `environment` block is Terraform-managed (see the
# lifecycle note in infra/modules/mailer/main.tf) — every value is deterministic
# from that module's own resources, so nothing needs deriving at deploy time.
#
# Also unlike api-prod.yml, there is no blue/green alias here. That is
# deliberate, not an omission — see the mailer note in
# infra/modules/mailer/main.tf: the smoke test below never reaches mailer code
# (API Gateway's IAM authorizer rejects the unsigned request first), two of the
# three Lambdas are queue consumers where "shift after a smoke test" is not a
# meaningful model, and aliasing only `ingress` would create version skew
# against consumers sharing its image and table schemas.
#
# This workflow applies no Terraform. Prod infra applies as the first leg of an
# approved release (release.yml → infra-prod.yml), or via infra-prod.yml
# dispatched on its own — never as a side effect of a service deploy.
#
# The FIRST deploy in a fresh environment cannot run through this workflow: an
# Image-package Lambda refuses to be created before its image exists. Bootstrap
# once by hand, per infra/modules/mailer/main.tf:
#   1. terraform -chdir=infra/envs/shared apply   (creates insolvia-shared-mailer)
#   2. docker build --target lambda services/mailer, tag <repo-url>:prod, push
#   3. terraform apply   (full)
# After that, every deploy is this workflow.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to deploy (default: main HEAD). Must have deployed green to staging."
        required: false
        type: string
      force:
        description: "Skip the staging-green check (emergency only)"
        required: false
        default: false
        type: boolean

  # Also callable by the Release pipeline, which chains the services in a
  # defined order behind its one approval. Same code path as a manual dispatch.
  workflow_call:
    inputs:
      sha:
        description: "Commit to deploy (default: main HEAD). Must have deployed green to staging."
        required: false
        type: string
      force:
        description: "Skip the staging-green check (emergency only)"
        required: false
        default: false
        type: boolean
      gated:
        description: "The caller already holds this run's insolvia-production approval — do not ask for a second one."
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  # Reading the insolvia/staging-release commit status.
  statuses: read

jobs:
  # Resolve + verify once, with no credentials and no environment — a commit
  # that never passed staging is rejected BEFORE anyone is asked to approve.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - id: commit
        uses: ./.github/actions/verified-commit
        with:
          sha: ${{ inputs.sha }}
          force: ${{ inputs.force }}

  # The human gate, and ONLY for a direct dispatch: release.yml already put
  # its own approval in front of the whole production stage and says so with
  # `gated: true`. (`inputs.gated` is absent on a plain dispatch, so the
  # comparison reads null there — which is not true, and the gate runs.)
  approve:
    needs: resolve
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gated != true }}
    runs-on: ubuntu-latest
    environment: insolvia-production
    steps:
      - run: echo "Production deploy of ${{ needs.resolve.outputs.sha }} approved."

  # `!cancelled() && !failure()` rather than the default `success()`: when the
  # release pipeline calls this, `approve` is SKIPPED, and the default would
  # silently skip the deploy behind it. A failed or rejected gate still stops it.
  deploy:
    needs: [resolve, approve]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    # Shared with every workflow that touches infra/envs/prod — the S3
    # backend's native lock (use_lockfile) fails-fast on anything that slips
    # past this group; the group is what turns "one fails" into "one waits".
    # Job-level, not workflow-level, so a dispatch parked at `approve` holds
    # nothing. See the matching comment in api-staging.yml for the incident
    # that proved it necessary.
    concurrency:
      group: insolvia-terraform-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"
          # The wrapper interposes on stdout, which corrupts the
          # `terraform output -raw` / `-json` command substitutions below.
          terraform_wrapper: false

      # Read-only: `output` needs the state, not an apply. Applying prod infra
      # is infra-prod.yml's job.
      - name: Read prod infra outputs
        id: tf
        run: |
          terraform -chdir=infra/envs/prod init -input=false
          {
            echo "repo=$(terraform -chdir=infra/envs/prod output -raw mailer_ecr_repository_url)"
            echo "domain=$(terraform -chdir=infra/envs/prod output -raw mailer_api_url)"
          } >> "$GITHUB_OUTPUT"
          terraform -chdir=infra/envs/prod output -json mailer_lambda_function_names \
            > mailer-functions.json

      - id: image
        uses: ./.github/actions/promote-image
        with:
          repository-url: ${{ steps.tf.outputs.repo }}
          sha: ${{ needs.resolve.outputs.sha }}

      # All three move together, to the same digest. They share one image with
      # different image_config.command entrypoints and the same table schemas,
      # so a partial update would mean version skew between the HTTP front door
      # and the queue consumers. No alias here, deliberately: see the mailer
      # note in infra/modules/mailer/main.tf.
      - name: Update Lambda code (ingress, sender, feedback)
        env:
          IMAGE_URI: ${{ steps.image.outputs.image-uri }}
        run: |
          # One image, three entrypoints — mailer-functions.json is the
          # {ingress, sender, feedback} map from mailer_lambda_function_names.
          # Loop rather than three copy-pasted steps so a fourth entrypoint
          # (should one ever exist) needs no workflow change.
          for function in $(jq -r '.[]' mailer-functions.json); do
            aws lambda update-function-code \
              --function-name "$function" \
              --image-uri "$IMAGE_URI"
          done
          for function in $(jq -r '.[]' mailer-functions.json); do
            aws lambda wait function-updated --function-name "$function"
          done

      # Keep the `prod` marker tag pointing at what prod actually runs.
      # api-prod.yml and marketing-prod.yml already do this; without it here,
      # `insolvia-shared-mailer:prod` would stay pinned forever to the image that
      # bootstrapped these Lambdas, while prod ran promoted digests. That tag
      # is what a from-scratch apply seeds new Lambdas from (var.image_tag), so
      # letting it go stale means a rebuilt prod mailer would come back on an
      # image nobody has run for months — silently, and only in the one code
      # path nobody exercises.
      - name: Move the prod marker tag
        env:
          REPO: ${{ steps.tf.outputs.repo }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          manifest="$(aws ecr batch-get-image \
            --repository-name "${REPO#*/}" \
            --image-ids "imageDigest=$DIGEST" \
            --query 'images[0].imageManifest' --output text)"
          aws ecr put-image \
            --repository-name "${REPO#*/}" \
            --image-tag prod \
            --image-manifest "$manifest" >/dev/null 2>&1 || \
            echo "::notice::\`prod\` tag already points at this digest."

      - name: Smoke test
        env:
          DOMAIN: ${{ steps.tf.outputs.domain }}
        run: |
          # The mailer API is SigV4-authenticated end to end — even /health (it
          # has no unauthenticated route at all, unlike the API service). An
          # unsigned request should get exactly a 403 from API Gateway's IAM
          # authorizer, which is enough to prove the custom domain, DNS, and
          # Lambda are wired together; a real send-path smoke test needs a
          # signed request as the registered caller, which is PR4's job once
          # the API service has a mailer client.
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST "$DOMAIN/v1/services/insolvia_api/messages")"
          if [ "$status" != "403" ]; then
            echo "expected 403 (Forbidden — unsigned request) from $DOMAIN, got $status" >&2
            exit 1
          fi
