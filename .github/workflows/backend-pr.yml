name: Backend · PR

# The .NET backend (ADR 0028). No `on.pull_request.paths:` filter, deliberately
# — see `.github/actions/changed-paths/action.yml`. `Backend (.NET)` is a
# required status check on `protect-main`, so it must trigger and report on
# *every* PR; the `steps.filter` guard below is what keeps an unrelated PR
# cheap. Re-adding a `paths:` filter would silently deadlock every PR that does
# not touch these paths.
on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    # The ruleset matches this exact string. Renaming it orphans the gate:
    # change it only together with scripts/update-ruleset.sh
    # (insolvia-branch-protection skill).
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the guard can diff against the PR base commit.
          fetch-depth: 0

      - id: filter
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            # Everything under backend/, the standalone spikes included: they
            # sit outside the solution but inherit backend/'s props files.
            backend/**
            .github/workflows/backend-pr.yml
            .github/actions/changed-paths/action.yml

      - uses: actions/setup-dotnet@v5
        if: steps.filter.outputs.run == 'true'
        with:
          # The exact SDK backend/global.json pins, so CI and a laptop agree.
          global-json-file: backend/global.json

      - name: Restore
        if: steps.filter.outputs.run == 'true'
        # --locked-mode: a dependency change must arrive with its
        # packages.lock.json diff, never be resolved fresh here.
        run: dotnet restore Insolvia.slnx --locked-mode

      - name: Format check
        if: steps.filter.outputs.run == 'true'
        run: dotnet format Insolvia.slnx --verify-no-changes --no-restore

      - name: Build
        if: steps.filter.outputs.run == 'true'
        run: dotnet build Insolvia.slnx --configuration Release --no-restore

      # The data-tier suites (Data.Tests, Migrator.Tests) start a postgres:17
      # container through Testcontainers, on the Docker the runner ships with.
      - name: Test
        if: steps.filter.outputs.run == 'true'
        run: dotnet test Insolvia.slnx --configuration Release --no-build

      # Packaging check: the exact image a deploy will ship must build, and the
      # compose image beside it. A host that gains its own Dockerfile target
      # adds its build line here in the same PR.
      - name: Build Lambda image
        if: steps.filter.outputs.run == 'true'
        run: docker build --target lambda -t insolvia-backend-api-pr-check .

      - name: Build development image
        if: steps.filter.outputs.run == 'true'
        run: docker build --target development -t insolvia-backend-api-dev-pr-check .

      - name: Build migrator Lambda image
        if: steps.filter.outputs.run == 'true'
        run: docker build --target migrator -t insolvia-backend-migrator-pr-check .

      - name: Build migrator development image
        if: steps.filter.outputs.run == 'true'
        run: docker build --target migrator-development -t insolvia-backend-migrator-dev-pr-check .

      - name: Build MCP Lambda image
        if: steps.filter.outputs.run == 'true'
        run: docker build --target mcp-lambda -t insolvia-backend-mcp-pr-check .

      - name: Build MCP development image
        if: steps.filter.outputs.run == 'true'
        run: docker build --target mcp-development -t insolvia-backend-mcp-dev-pr-check .
