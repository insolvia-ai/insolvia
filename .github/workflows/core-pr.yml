name: Core · PR

# No `on.pull_request.paths:` filter, deliberately — see
# `.github/actions/changed-paths/action.yml`. This job is a required status
# check on `protect-main` (added post-merge via scripts/update-ruleset.sh), so
# it must trigger and report on *every* PR; the `steps.filter` guard below is
# what keeps an unrelated PR cheap. Re-adding a `paths:` filter would silently
# deadlock every PR that does not touch these paths.
on:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/insolvia_core
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the guard can diff against the PR base commit.
          fetch-depth: 0

      - id: filter
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            packages/insolvia_core/**
            # Tool pins come from the API's requirements files (see the
            # install step) — a pin bump must re-run this suite too.
            services/api/requirements.txt
            services/api/requirements-dev.txt
            # Shared root lint config — a rule change must re-lint this package.
            ruff.toml
            .github/workflows/core-pr.yml
            .github/actions/changed-paths/action.yml

      - uses: actions/setup-python@v6
        if: steps.filter.outputs.run == 'true'
        with:
          # Matches pyproject's requires-python and the services that consume
          # this package (public.ecr.aws/lambda/python:3.12).
          python-version: "3.12"

      - name: Install dependencies
        if: steps.filter.outputs.run == 'true'
        # The API's requirements files, deliberately: they already pin boto3,
        # PyJWT, and the ruff/mypy/pytest toolchain — and they install THIS
        # package by local path. One set of pins for every consumer beats a
        # second pin file here that would drift from it. Run from services/api
        # because pip resolves a requirements file's relative paths against
        # the current working directory.
        working-directory: services/api
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        if: steps.filter.outputs.run == 'true'
        run: ruff check .

      - name: Format check
        if: steps.filter.outputs.run == 'true'
        run: ruff format --check .

      - name: Type check
        if: steps.filter.outputs.run == 'true'
        run: mypy

      - name: Test
        if: steps.filter.outputs.run == 'true'
        run: pytest
