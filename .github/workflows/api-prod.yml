name: API · Deploy · Production

# PROMOTES the image staging validated — it does not build one.
#
# The shared insolvia-shared-api repository (infra/envs/shared) already holds the
# image staging tested, tagged `sha-<commit>`. This workflow resolves that tag
# to an immutable digest and points the prod Lambda at it, so production runs
# the exact bytes that were exercised on staging rather than a fresh compile of
# the same source. There is deliberately no `docker build` here.
#
# THE NORMAL WAY IN is release.yml: its production stage calls this after its
# own staging stage went green and its single `insolvia-production` approval
# was given, passing `gated: true` so this workflow does not ask for a second
# approval. Dispatching this BY HAND is the exception — a single-service
# emergency deploy — and that path brings its own two gates:
#   • the commit must carry the `insolvia/staging-release` commit status (see
#     .github/actions/verified-commit) — checked in `resolve`, BEFORE the
#     approval, so a commit staging never blessed is rejected without
#     consuming anyone's click, and
#   • the `approve` job carries the `insolvia-production` environment, whose
#     required reviewer must approve the run.
#
# Traffic moves LAST. The new version is published, smoke-tested by its own
# version ARN while nothing routes to it, and only then does the `live` alias
# shift. A failed smoke test leaves the previous version serving — the whole
# reason the alias exists (infra/modules/api_service/main.tf).
#
# This workflow applies no Terraform. Prod infra applies as the first leg of an
# approved release (release.yml → infra-prod.yml), or via infra-prod.yml
# dispatched on its own — never as a side effect of a service deploy.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to deploy (default: main HEAD). Must have deployed green to staging."
        required: false
        type: string
      force:
        description: "Skip the staging-green check (emergency only)"
        required: false
        default: false
        type: boolean

  # Also callable by the Release pipeline, which chains the services in a
  # defined order behind its one approval. Same code path as a manual dispatch.
  workflow_call:
    inputs:
      sha:
        description: "Commit to deploy (default: main HEAD). Must have deployed green to staging."
        required: false
        type: string
      force:
        description: "Skip the staging-green check (emergency only)"
        required: false
        default: false
        type: boolean
      gated:
        description: "The caller already holds this run's insolvia-production approval — do not ask for a second one."
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  # Reading the insolvia/staging-release commit status. Without this the gate
  # cannot see whether staging validated the commit.
  statuses: read

jobs:
  # Resolve + verify once, with no credentials and no environment — a commit
  # that never passed staging is rejected BEFORE anyone is asked to approve.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - id: commit
        uses: ./.github/actions/verified-commit
        with:
          sha: ${{ inputs.sha }}
          force: ${{ inputs.force }}

  # The human gate, and ONLY for a direct dispatch: release.yml already put
  # its own approval in front of the whole production stage and says so with
  # `gated: true`. (`inputs.gated` is absent on a plain dispatch, so the
  # comparison reads null there — which is not true, and the gate runs.)
  approve:
    needs: resolve
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gated != true }}
    runs-on: ubuntu-latest
    environment: insolvia-production
    steps:
      - run: echo "Production deploy of ${{ needs.resolve.outputs.sha }} approved."

  # `!cancelled() && !failure()` rather than the default `success()`: when the
  # release pipeline calls this, `approve` is SKIPPED, and the default would
  # silently skip the deploy behind it. A failed or rejected gate still stops it.
  deploy:
    needs: [resolve, approve]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    # This job applies no Terraform, but the group still serializes it against
    # infra-prod.yml, so a promotion cannot land mid-apply while the Lambda's
    # configuration is being rewritten underneath it. Job-level, not
    # workflow-level, so a dispatch parked at `approve` holds nothing.
    concurrency:
      group: insolvia-terraform-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"
          # The wrapper interposes on stdout, which corrupts the
          # `terraform output -raw` command substitutions below.
          terraform_wrapper: false

      # Read-only: `output` needs the state, not an apply. Applying prod infra
      # is infra-prod.yml's job.
      - name: Read prod infra outputs
        id: tf
        run: |
          terraform -chdir=infra/envs/prod init -input=false
          tf() { terraform -chdir=infra/envs/prod output -raw "$1"; }
          {
            echo "repo=$(tf api_ecr_repository_url)"
            echo "function=$(tf api_lambda_function_name)"
            echo "domain=$(tf api_domain)"
            echo "alias=$(tf api_lambda_alias_name)"
            echo "jobs_repo=$(tf jobs_ecr_repository_url)"
            echo "worker_function=$(tf jobs_worker_function_name)"
          } >> "$GITHUB_OUTPUT"

      - id: image
        uses: ./.github/actions/promote-image
        with:
          repository-url: ${{ steps.tf.outputs.repo }}
          sha: ${{ needs.resolve.outputs.sha }}

      # The worker image is promoted by the same rule as the api's — the
      # digest staging validated, never a rebuild. The `record` job stamps
      # sha-<commit> on insolvia-shared-jobs like every other repo, so an
      # unchanged pipeline still resolves.
      - id: worker-image
        uses: ./.github/actions/promote-image
        with:
          repository-url: ${{ steps.tf.outputs.jobs_repo }}
          sha: ${{ needs.resolve.outputs.sha }}

      - name: Update Lambda code
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
          IMAGE_URI: ${{ steps.image.outputs.image-uri }}
        run: |
          # No --publish: the next step rewrites the environment from SSM, and
          # a version published now would snapshot the OLD configuration. The
          # alias would then serve the new code with stale config.
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --image-uri "$IMAGE_URI"
          aws lambda wait function-updated --function-name "$FUNCTION"

      - name: Re-derive Lambda environment from SSM
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # /insolvia/prod/api/<kebab-key> -> KEBAB_KEY:
          #   insolvia-env        -> INSOLVIA_ENV  (= "production"; the infra
          #                          env is "prod", the app-level value is not —
          #                          the SSM parameter records that mapping)
          #   waitlist-table-name -> WAITLIST_TABLE_NAME
          # Terraform ignores `environment` drift on the Lambda (see
          # infra/modules/api_service/main.tf) — this step owns it.
          environment="$(
            aws ssm get-parameters-by-path \
              --path /insolvia/prod/api \
              --with-decryption \
              --query 'Parameters[].{Name:Name,Value:Value}' \
              --output json \
            | jq -c 'map({key: (.Name | split("/") | last | ascii_upcase | gsub("-"; "_")), value: .Value})
                     | {Variables: from_entries}'
          )"
          # Refuse to ship nonsense: an empty or half-applied namespace would
          # otherwise silently wipe every variable the service reads.
          echo "$environment" | jq -e '.Variables.INSOLVIA_ENV == "production"' > /dev/null
          # The Anthropic key rides a GitHub environment secret, not SSM —
          # the founder's choice (2026-09-05): pasted once into the
          # environment, overlaid here onto the derived namespace. Empty
          # secret = variable absent = the worker composes no ReviewModel
          # and AI jobs fail honestly with not_configured (core/config.py).
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            environment="$(echo "$environment" | jq -c --arg v "$ANTHROPIC_API_KEY" '.Variables.ANTHROPIC_API_KEY = $v')"
          fi
          aws lambda update-function-configuration \
            --function-name "$FUNCTION" \
            --environment "$environment"
          aws lambda wait function-updated --function-name "$FUNCTION"

      # Code and configuration are settled, so this snapshot is coherent.
      # Publishing does NOT move traffic: the alias still points at the
      # previous version until the smoke test below passes.
      - name: Publish candidate version
        id: candidate
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
        run: |
          version="$(aws lambda publish-version \
            --function-name "$FUNCTION" \
            --query Version --output text)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo ":hourglass: Published version \`$version\` — not yet serving." >> "$GITHUB_STEP_SUMMARY"

      # Invoke the candidate DIRECTLY by version qualifier. Production traffic
      # is still on the old version throughout, so a broken build fails here
      # having served nobody.
      - name: Smoke test the candidate
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          # Payload format 2.0 — the shape API Gateway sends and Mangum parses.
          cat > event.json <<'EOF'
          {
            "version": "2.0",
            "routeKey": "$default",
            "rawPath": "/health",
            "rawQueryString": "",
            "headers": { "host": "api.insolvia.ai", "accept": "*/*" },
            "requestContext": {
              "http": {
                "method": "GET", "path": "/health", "protocol": "HTTP/1.1",
                "sourceIp": "127.0.0.1", "userAgent": "insolvia-deploy-smoke"
              }
            },
            "isBase64Encoded": false
          }
          EOF

          aws lambda invoke \
            --function-name "$FUNCTION:$VERSION" \
            --payload fileb://event.json \
            --cli-read-timeout 60 \
            response.json > invoke-meta.json
          cat invoke-meta.json

          # An unhandled exception is a 200 from the Lambda API with
          # FunctionError set — checking only the HTTP status would pass a
          # crashed handler.
          if jq -e '.FunctionError' invoke-meta.json > /dev/null; then
            echo "::error::Candidate version $VERSION raised: $(jq -r '.FunctionError' invoke-meta.json)"
            cat response.json
            exit 1
          fi

          jq -e '.statusCode == 200' response.json > /dev/null
          jq -r '.body' response.json | jq -e '.environment == "production"' > /dev/null

      - name: Shift live traffic to the candidate
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
          ALIAS: ${{ steps.tf.outputs.alias }}
          VERSION: ${{ steps.candidate.outputs.version }}
          REPO: ${{ steps.tf.outputs.repo }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          previous="$(aws lambda get-alias \
            --function-name "$FUNCTION" --name "$ALIAS" \
            --query FunctionVersion --output text)"

          aws lambda update-alias \
            --function-name "$FUNCTION" \
            --name "$ALIAS" \
            --function-version "$VERSION"

          # Move the `prod` marker tag onto the promoted digest, so a
          # from-scratch `terraform apply` seeds the Lambda from what prod is
          # actually running (infra/modules/api_service/main.tf, var.image_tag).
          manifest="$(aws ecr batch-get-image \
            --repository-name "${REPO#*/}" \
            --image-ids "imageDigest=$DIGEST" \
            --query 'images[0].imageManifest' --output text)"
          aws ecr put-image \
            --repository-name "${REPO#*/}" \
            --image-tag prod \
            --image-manifest "$manifest" >/dev/null 2>&1 || \
            echo "::notice::\`prod\` tag already points at this digest."

          {
            echo ":rocket: **Live.** Alias \`$ALIAS\` moved \`$previous\` → \`$VERSION\`."
            echo
            echo "Roll back without a rebuild:"
            echo '```bash'
            echo "aws lambda update-alias --function-name $FUNCTION --name $ALIAS --function-version $previous"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Belt-and-braces: the candidate passed in isolation, so this proves the
      # alias shift and the API Gateway integration actually took effect.
      - name: Verify through the public endpoint
        env:
          DOMAIN: ${{ steps.tf.outputs.domain }}
        run: |
          curl -sSf --retry 5 --retry-delay 3 --retry-all-errors \
            "https://$DOMAIN/health" | tee health.json
          jq -e '.environment == "production"' health.json > /dev/null

      # ── The pipeline worker (ADR 0018) ──────────────────────────
      # After the API is live, same as staging: no alias to shift (the module
      # owns that argument), so promote the digest, re-derive the environment,
      # smoke-invoke directly, then move the `prod` marker tag.
      - name: Update worker code
        env:
          WORKER: ${{ steps.tf.outputs.worker_function }}
          IMAGE_URI: ${{ steps.worker-image.outputs.image-uri }}
        run: |
          aws lambda update-function-code \
            --function-name "$WORKER" \
            --image-uri "$IMAGE_URI"
          aws lambda wait function-updated --function-name "$WORKER"

      - name: Re-derive worker environment from SSM
        env:
          WORKER: ${{ steps.tf.outputs.worker_function }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # The SAME /insolvia/prod/api namespace as the API Lambda — the
          # worker is the API's long-running half and reads the same config.
          environment="$(
            aws ssm get-parameters-by-path \
              --path /insolvia/prod/api \
              --with-decryption \
              --query 'Parameters[].{Name:Name,Value:Value}' \
              --output json \
            | jq -c 'map({key: (.Name | split("/") | last | ascii_upcase | gsub("-"; "_")), value: .Value})
                     | {Variables: from_entries}'
          )"
          echo "$environment" | jq -e '.Variables.INSOLVIA_ENV == "production"' > /dev/null
          # The Anthropic key rides a GitHub environment secret, not SSM —
          # the founder's choice (2026-09-05): pasted once into the
          # environment, overlaid here onto the derived namespace. Empty
          # secret = variable absent = the worker composes no ReviewModel
          # and AI jobs fail honestly with not_configured (core/config.py).
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            environment="$(echo "$environment" | jq -c --arg v "$ANTHROPIC_API_KEY" '.Variables.ANTHROPIC_API_KEY = $v')"
          fi
          aws lambda update-function-configuration \
            --function-name "$WORKER" \
            --environment "$environment"
          aws lambda wait function-updated --function-name "$WORKER"

      # A synthetic SQS event whose job id has no record: run_job drops it by
      # design, so a clean return proves boot + handler + store reachability
      # without writing anything to the prod table.
      - name: Smoke test the worker
        env:
          WORKER: ${{ steps.tf.outputs.worker_function }}
        run: |
          cat > worker-event.json <<'EOF'
          {
            "Records": [
              {
                "body": "{\"version\":1,\"jobId\":\"00000000-0000-4000-8000-00000000smoke\",\"caseId\":\"00000000-0000-4000-8000-00000000smoke\",\"kind\":\"echo\"}"
              }
            ]
          }
          EOF
          aws lambda invoke \
            --function-name "$WORKER" \
            --payload fileb://worker-event.json \
            --cli-read-timeout 120 \
            worker-response.json > worker-invoke-meta.json
          cat worker-invoke-meta.json
          if jq -e '.FunctionError' worker-invoke-meta.json > /dev/null; then
            echo "::error::Worker smoke invocation raised: $(jq -r '.FunctionError' worker-invoke-meta.json)"
            cat worker-response.json
            exit 1
          fi

      - name: Move the jobs prod marker tag
        env:
          JOBS_REPO: ${{ steps.tf.outputs.jobs_repo }}
          DIGEST: ${{ steps.worker-image.outputs.digest }}
        run: |
          # Same seed-tag maintenance as the api repo's step above: a
          # from-scratch apply seeds the worker Lambda from `prod`.
          manifest="$(aws ecr batch-get-image \
            --repository-name "${JOBS_REPO#*/}" \
            --image-ids "imageDigest=$DIGEST" \
            --query 'images[0].imageManifest' --output text)"
          aws ecr put-image \
            --repository-name "${JOBS_REPO#*/}" \
            --image-tag prod \
            --image-manifest "$manifest" >/dev/null 2>&1 || \
            echo "::notice::jobs \`prod\` tag already points at this digest."
