name: Infra · Terraform plan · PR

# No `on.pull_request.paths:` filter, deliberately — see
# `.github/actions/changed-paths/action.yml`. This job is a required status
# check on `protect-main`, so it must trigger and report on *every* PR; the
# `steps.filter` guard below is what keeps an unrelated PR cheap. Re-adding a
# `paths:` filter would silently deadlock every PR that does not touch these
# paths.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-validate:
    # Matrixed, so this reports one check per root — "Terraform validate
    # (staging)" and "(prod)" are required by name; "(dev)" runs for coverage.
    # (The file keeps its old name: "(shared)", "(ci-trust)" and
    # "(account-access)" validate in insolvia-services now, where those roots
    # moved on 2026-10-11.)
    name: Terraform validate
    runs-on: ubuntu-latest
    strategy:
      # One environment failing should not cancel the others. With fail-fast on,
      # a flake in `prod` hides whether `staging` actually passes, so
      # a re-run is the only way to learn anything.
      fail-fast: false
      matrix:
        # `dev` (per-developer machine) is validated offline here like the
        # others but never applied by CI. Its "Terraform validate (dev)" check is
        # NOT part of the required-checks contract (the ruleset requires
        # staging/prod); it runs for coverage, not as a gate.
        env: [staging, prod, dev]
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the guard can diff against the PR base commit.
          fetch-depth: 0

      - id: filter
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            infra/**
            .tflint.hcl
            .github/workflows/shared-infra-plan.yml
            .github/actions/changed-paths/action.yml

      - uses: hashicorp/setup-terraform@v4
        if: steps.filter.outputs.run == 'true'
        with:
          terraform_version: "~1.10"

      - uses: terraform-linters/setup-tflint@v6
        if: steps.filter.outputs.run == 'true'
        with:
          tflint_version: v0.62.0

      - name: Format check
        if: steps.filter.outputs.run == 'true'
        run: terraform fmt -check -recursive

      - name: TFLint
        if: steps.filter.outputs.run == 'true'
        # `tflint --init` pulls the AWS ruleset from the GitHub API. Without a
        # token that request is anonymous, and GitHub-hosted runners share
        # outbound IPs — so the 60/hr anonymous quota is routinely exhausted by
        # other tenants and the job dies on an unrelated 403:
        #   Failed to download tflint-ruleset-aws...: 403 API rate limit exceeded
        # The default GITHUB_TOKEN authenticates the download and removes the
        # whole failure class. It needs no extra permissions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init
          tflint --chdir=infra/envs/${{ matrix.env }} --recursive

      # Offline validation — no AWS credentials needed (backend disabled).
      - name: Validate ${{ matrix.env }}
        if: steps.filter.outputs.run == 'true'
        run: |
          terraform -chdir=infra/envs/${{ matrix.env }} init -backend=false
          terraform -chdir=infra/envs/${{ matrix.env }} validate

      # `terraform test` for every module that carries a tests/ directory
      # (today modules/filing_credentials, whose tests pin the vault key's
      # policy whole — ADR 0024 PR 4). Offline: those tests mock the AWS
      # provider. Run in the `staging` leg only — once is enough, and that
      # leg is a required check, so a broken pin cannot merge.
      - name: Module tests
        if: steps.filter.outputs.run == 'true' && matrix.env == 'staging'
        run: |
          for tests in infra/modules/*/tests; do
            module="$(dirname "$tests")"
            echo "::group::terraform test $module"
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" test
            echo "::endgroup::"
          done
