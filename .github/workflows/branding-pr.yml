name: Cognito branding · PR

# The drift gate for every surface generated from Insolvia's brand palette:
# the app's ThemeProvider overrides and favicon, and the marketing site's and
# admin portal's brand.css.
#
# The job KEEPS the name `Cognito branding` although it no longer gates
# anything of Cognito's. `protect-main` matches a required check by exact name
# (see the insolvia-branch-protection skill), so renaming it here silently
# orphans the gate on `main` — a rename has to be made in the ruleset first.
# Cognito's sign-in page was the surface this check was first written for; its
# style moved to insolvia-services with the rest of auth on 2026-10-12 (ADR
# 0026, amended), as checked-in files beside its modules/auth.
#
# It checks the committed outputs against the INSTALLED @insolvia-ai/tokens
# and against brand/ (colors, fonts, radii, marks): it fails on a hand-edit,
# and when a tokens bump lands without regenerating. The surfaces share no
# import, so this check is the only thing that can notice one falling behind.
#
# No `on.pull_request.paths:` filter, deliberately — see
# `.github/actions/changed-paths/action.yml`. This job is a required status
# check on `protect-main`, so it must trigger and report on *every* PR; the
# `steps.filter` guard is what keeps an unrelated PR cheap. Re-adding a
# `paths:` filter would silently deadlock every PR that does not touch these
# paths, and there is no job-level `if:` for the same reason — a skipped job's
# standing with a required check is a subtlety this repo refuses to rest on.
#
# The ruleset matches the job name `Cognito branding` by EXACT name (see the
# insolvia-branch-protection skill), so renaming the job silently orphans the
# gate.
on:
  pull_request:

permissions:
  contents: read
  # The root `npm ci` installs @insolvia-ai/tokens from GitHub Packages, which
  # is the whole input to this check.
  packages: read

jobs:
  branding:
    name: Cognito branding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the guard can diff against the PR base commit.
          fetch-depth: 0

      - id: filter
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            # The documents under gate, and the tools that write them.
            apps/insolvia_app/src/theme/brand-colors.ts
            apps/insolvia_app/public/favicon.svg
            apps/insolvia_marketing/app/styles/brand.css
            apps/insolvia_admin/src/styles/brand.css
            tool/**
            # Everything they are generated FROM: the palette, the typefaces,
            # the corner radii, and the two marks. A change to any of these
            # with no regeneration is the exact drift this gate exists to
            # catch, and it touches nothing else in the tree.
            #
            # `brand/**`, not a list of filenames. It was `brand/colors.json`
            # alone, which silently stopped covering the inputs as fonts.json,
            # radii.json, wordmark.svg and icon.svg were each added beside it —
            # a PR changing only one of those would have skipped its own gate.
            # A glob cannot fall behind that way.
            brand/**
            # The root manifest and lockfile ARE the input now: they pin which
            # @insolvia-ai/tokens version the colours are checked against. A
            # tokens bump with no regeneration changes nothing else in the
            # tree, so without these two lines it would skip this gate
            # entirely — which is precisely the failure this workflow exists
            # to catch.
            package.json
            package-lock.json
            # Shared config the tool's typecheck and lint resolve through.
            tsconfig.base.json
            eslint.base.js
            .prettierrc
            .npmrc
            .github/workflows/branding-pr.yml
            .github/actions/changed-paths/action.yml

      # Must match the root package.json's `engines.node` (">=24").
      - uses: actions/setup-node@v5
        if: steps.filter.outputs.run == 'true'
        with:
          node-version: "24"
          cache: npm

      - name: Install
        if: steps.filter.outputs.run == 'true'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Typecheck and lint before the drift check: `tool/` is not a workspace
      # member, so the per-member fan-out in app-pr.yml/api-client-pr.yml never
      # covers it. This job is its only gate.
      - name: Typecheck
        if: steps.filter.outputs.run == 'true'
        run: npm run typecheck:tool

      - name: Lint
        if: steps.filter.outputs.run == 'true'
        run: npm run lint:tool

      - name: Format check
        if: steps.filter.outputs.run == 'true'
        run: npx prettier --check tool

      - name: Branding drift check
        if: steps.filter.outputs.run == 'true'
        run: npm run tokens:check
