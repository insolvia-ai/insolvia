name: App · Deploy · Staging

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      # The app is an npm workspace member, so the root manifest and lockfile
      # are real inputs to its build — a dependency bump that touches only the
      # lockfile still changes the bundle that ships.
      - "package.json"
      - "package-lock.json"
      - "infra/envs/staging/**"
      - "infra/modules/**"
      - ".github/workflows/app-staging.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Shared with every workflow that `terraform apply`s infra/envs/staging
# (api-staging.yml) — the backend has no state locking, so concurrent applies
# of one env race. See the matching comment in api-staging.yml.
concurrency:
  group: insolvia-terraform-staging
  cancel-in-progress: false

jobs:
  # ── Build + publish the artifact (no AWS credentials needed) ────
  #
  # A separate job from `deploy`, for two reasons: the build runs BEFORE the
  # `environment: insolvia-staging` gate, so a broken build never consumes an
  # approval, and the uploaded artifact is the record of what actually shipped.
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must match the root package.json's `engines.node` (">=24"). No
      # `cache-dependency-path`: the app is an npm workspace member, so the
      # lockfile is the repo-root one setup-node already looks for by default.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # ── The Metro cache trap — this is why `--clear` is here ──────────────
      #
      # `EXPO_PUBLIC_*` values are inlined into the bundle at build time, but
      # Metro's transform cache keys on file CONTENT and CONFIG — not on the
      # environment the build ran in. So two exports of an unchanged tree with
      # different `EXPO_PUBLIC_INSOLVIA_ENV` can hit the same cache entries and
      # emit byte-identical output. The failure mode is silent and severe in
      # either direction — a bundle with the wrong environment compiled into it,
      # uploaded to the other environment's bucket, talking to the wrong API,
      # with nothing in the logs to say so.
      #
      # `--clear` drops the cache before bundling, which makes the environment
      # impossible to inherit from a previous build. The alternative is a
      # per-env `cacheStoreDirectory` in metro.config.js; that is faster but it
      # lives in the app (another agent's file) and it fails open — a typo in
      # the path silently shares one cache again. A cold bundle on a deploy is
      # a minute we can afford; shipping the wrong environment is not.
      #
      # The app's `build` script IS `expo export -p web --clear` — the flag
      # lives in exactly one place, the script, and the app's package.json
      # explains why it must stay there. Do not append `-- --clear` here:
      # expo rejects a repeated flag outright ("Can only provide one instance
      # of -c or --clear"), which is how a doubled flag once broke this very
      # deploy.
      - name: Build web (staging)
        env:
          EXPO_PUBLIC_INSOLVIA_ENV: staging
        run: npm run build --workspace apps/insolvia_app

      - uses: actions/upload-artifact@v4
        with:
          name: insolvia-web-staging
          path: apps/insolvia_app/dist
          retention-days: 14

  # ── Deploy ─────────────────────────────────────────────────────
  deploy:
    needs: [build-web]
    runs-on: ubuntu-latest
    environment: insolvia-staging
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
          # The wrapper interposes on stdout, which corrupts the
          # `terraform output -raw` captures below — same reason app-prod.yml
          # sets it.
          terraform_wrapper: false

      - name: Apply staging infra
        id: tf
        run: |
          terraform -chdir=infra/envs/staging init
          terraform -chdir=infra/envs/staging apply -auto-approve
          {
            echo "bucket=$(terraform -chdir=infra/envs/staging output -raw bucket_name)"
            echo "dist=$(terraform -chdir=infra/envs/staging output -raw distribution_id)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: insolvia-web-staging
          path: web

      # ── Two-tier cache sync, inline ──────────────────────────────────────
      #
      # Expo content-hashes its bundle. Verified against a real export:
      #   _expo/static/js/web/entry-<hash>.js
      #   _expo/static/css/global-<hash>.css
      # so everything under `_expo/` is content-addressed and genuinely safe to
      # cache forever.
      #
      # TWO tiers, not one. The marketing site syncs its whole bucket in a
      # single immutable pass (marketing-staging.yml) and that is only correct
      # because its bucket holds nothing BUT hashed assets — its HTML is
      # rendered by a Lambda. This bucket is not that: it holds `index.html`
      # and everything copied out of the app's `public/`, all unhashed. One
      # immutable pass here would pin a returning browser to a stale
      # `index.html` for a year, and no CloudFront invalidation can reach a
      # client-side cache. Do not "simplify" this into marketing's version.
      #
      # ORDER MATTERS: hashed assets first. `index.html` names the chunks it
      # loads, so if HTML went up first there would be a window where the live
      # page referenced a chunk that had not been uploaded yet.
      #
      # NO `--delete` ON THE HASHED PASS, deliberately. These distributions
      # rewrite 403/404 to `index.html` for SPA deep links, so a pruned chunk
      # does NOT 404 — CloudFront answers with `index.html`, HTTP 200,
      # `Content-Type: text/html`. The browser then fails with "Expected a
      # JavaScript module script but the server responded with a MIME type of
      # text/html", which is a genuinely confusing error for anyone still
      # sitting on the previous page when a deploy lands. Old chunks are small
      # and cost pennies; prune them on a lag (a lifecycle rule or a manual
      # sweep), never in the same breath as an upload.
      - name: Sync to S3 + invalidate
        env:
          SRC: web
          BUCKET: ${{ steps.tf.outputs.bucket }}
          DIST: ${{ steps.tf.outputs.dist }}
        run: |
          set -euo pipefail

          # 1. Hashed, content-addressed assets — first, and cached forever.
          aws s3 sync "$SRC/_expo" "s3://$BUCKET/_expo" \
            --cache-control "public,max-age=31536000,immutable"

          # 2. Everything else — index.html and the unhashed `public/` payload.
          #    Never cached, because the names are stable and the bytes are not.
          aws s3 sync "$SRC" "s3://$BUCKET" --exclude "_expo/*" \
            --cache-control "no-cache,no-store,must-revalidate"

          # 3. Invalidate the edge.
          #    Tier 2 is `no-store` at the browser, but CloudFront's managed
          #    CachingOptimized policy has a 1s minimum TTL that overrides an
          #    origin `no-cache`, so the edge still needs telling.
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"
