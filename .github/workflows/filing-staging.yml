name: Filing · Deploy · Staging

# Steady-state deploy for the filing worker (ADR 0024 PR 7; the .NET host
# backend/src/Insolvia.Filing since the switch, ADR 0028): push a fresh image
# (backend/Dockerfile's `filing-lambda` target), point the Lambda at it,
# smoke-test it. The Lambda has no alias and no SSM-derived environment,
# unlike the API's and the MCP server's: it is a queue consumer (no router to
# protect — job_pipeline's reasoning), and its environment is names only —
# the database contract, the bucket, the two key aliases and the kill
# switch's parameter — which Terraform owns outright
# (infra/modules/filing_worker). The migrator leg ran before it.
#
# Staging's worker reaches NO court: the fence (src/Insolvia.Filing/Fence)
# allows no staging host until ADR 0024 PR 10 verifies a training database,
# the fake is never deployed, and the kill switch is created off. Every job
# hands back before a credential is opened.
#
# The FIRST deploy in a fresh environment needs the image-before-apply
# bootstrap at the top of infra/modules/filing_worker/main.tf:
#   1. insolvia-services releases infra/envs/shared   (creates insolvia-shared-filing-dotnet)
#   2. scripts/bootstrap-ecr-images.sh staging filing
#   3. terraform apply   (full)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: insolvia-terraform-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: insolvia-staging
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"
          # The wrapper interposes on stdout, which corrupts the
          # `terraform output -raw` command substitutions below.
          terraform_wrapper: false

      - name: Read staging infra outputs
        id: tf
        run: |
          terraform -chdir=infra/envs/staging init
          {
            echo "repo=$(terraform -chdir=infra/envs/staging output -raw filing_ecr_repository_url)"
            echo "function=$(terraform -chdir=infra/envs/staging output -raw filing_worker_function_name)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        env:
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin "${REPO%%/*}"

      - name: Build and push image
        env:
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          # `sha-<sha>` is the immutable identity production promotes by
          # digest; `staging` is the from-scratch-apply seed. Context is
          # backend/ (backend/Dockerfile's header); the fake CM/ECF is a test
          # fixture and never reaches the image.
          docker build --target filing-lambda \
            -t "$REPO:sha-${{ github.sha }}" \
            -t "$REPO:staging" \
            backend
          docker push "$REPO:sha-${{ github.sha }}"
          docker push "$REPO:staging"

      - name: Update Lambda code
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
          REPO: ${{ steps.tf.outputs.repo }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --image-uri "$REPO:sha-${{ github.sha }}"
          aws lambda wait function-updated --function-name "$FUNCTION"

      # The worker has no endpoint, so the smoke test is one invocation with a
      # WELL-FORMED filing job naming an approval that does not exist: the
      # image boots, its configuration loads (a deployed worker REFUSES to
      # start without its kill switch parameter, its key aliases, or with a
      # fake court configured), the whole composition constructs, and the
      # approval lookup — a SELECT against Aurora as the `filing` role,
      # through the VPC — answers nothing, so the run answers `dropped`
      # (no_such_approval): writing nothing, opening nothing, contacting no
      # court. A malformed body would drop before the database, proving less.
      - name: Smoke test the worker
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
        run: |
          body='{"approval_id":"00000000-0000-4000-8000-000000000000","case_id":"00000000-0000-4000-8000-000000000000","filing_id":"00000000-0000-4000-8000-000000000000","kind":"filing.submit","version":1}'
          jq -cn --arg body "$body" '{Records: [{body: $body}]}' > smoke.json
          aws lambda invoke \
            --function-name "$FUNCTION" \
            --payload fileb://smoke.json \
            --cli-read-timeout 120 \
            response.json > invoke-meta.json
          cat invoke-meta.json response.json
          if jq -e '.FunctionError' invoke-meta.json > /dev/null; then
            echo "::error::The filing worker raised on its smoke invocation."
            exit 1
          fi
          jq -e '.outcomes == ["dropped"]' response.json > /dev/null
