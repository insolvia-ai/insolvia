name: Design system · Publish · Shared

# Trigger: push to main (+ manual dispatch as an escape hatch).
#
# Push, not dispatch-only, because the consumer is the marketing site's CI: a
# version bump merged to main must be installable without a human remembering
# to go press a button. The job is a no-op on every push that does not change
# the version (see the guard below), so "publish on push" costs one cheap
# registry lookup and never a red X.
#
# `workflow_dispatch` stays for re-publishing after a transient registry
# failure, and for the very first publish of a package version that landed on
# main before this workflow existed.
#
# HISTORY: while the old web-only package (insolvia_design_system_react)
# coexisted, its design-system-react-publish.yml published the SAME npm name,
# @insolvia-ai/design-system, on the 0.1.x line, while this workflow published
# the cross-platform rewrite on the 0.2.x line. That was safe precisely because
# both jobs are idempotent BY VERSION: each asks the registry about its own
# package.json's exact version and publishes only when it is absent, so the
# two lines can never overwrite each other. PR 2 deletes the old package and
# its workflows.
on:
  push:
    branches: [main]
    paths:
      - "packages/insolvia_design_system/**"
      - ".github/workflows/design-system-publish.yml"
  workflow_dispatch:

# `packages: write` is the whole privilege set this job needs — it publishes to
# GitHub Packages, not to AWS. No `id-token: write`: there is no OIDC role here.
permissions:
  contents: read
  packages: write

concurrency:
  group: insolvia-design-system-publish
  cancel-in-progress: false

# Job-wide, not per-step: setup-node's `registry-url` below writes an .npmrc
# whose auth line reads `${NODE_AUTH_TOKEN}` from the environment, and npm
# fails hard on any config read when a referenced variable is unset — so every
# npm invocation in this job needs it, the root `npm ci` included.
env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

defaults:
  run:
    working-directory: packages/insolvia_design_system

jobs:
  publish:
    runs-on: ubuntu-latest
    # No `environment:` and no deploy-style gating: publishing an npm package
    # to GitHub Packages touches no AWS at all — no account, no Route53, no
    # CloudFront, no OIDC role — so this job never belongs behind the infra
    # deploy machinery. See docs/PACKAGE_PUBLISHING.md.
    steps:
      - uses: actions/checkout@v4

      # Must match the root package.json's `engines.node` (">=24").
      #
      # Two deviations from design-system-react-publish.yml, both because this
      # package is an npm WORKSPACE MEMBER with no lockfile of its own:
      #
      #   - `cache-dependency-path` is the ROOT lockfile — the only tree this
      #     job installs (setup-node's default, spelled out for clarity).
      #   - `registry-url`/`scope` ARE set here, where the old workflow
      #     deliberately relied on its committed package-level .npmrc. This
      #     package has no .npmrc; setup-node's generated one supplies the
      #     @insolvia-ai → npm.pkg.github.com mapping and the auth line that
      #     `npm view`/`npm publish` below need. It does not disturb the root
      #     `npm ci`: the workspace members are the only @insolvia-ai
      #     dependencies in the root tree, and npm links those from source
      #     without touching a registry.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@insolvia-ai"

      # Root install, not a package-local one (the old workflow ran `npm ci`
      # inside the package against its own lockfile; this package has neither).
      # No build needs it — see below — it is here so any pack-time lifecycle
      # script the package declares runs against the tree the committed
      # lockfile pins, and so `ci` fails loudly if the root package.json and
      # lockfile have drifted apart.
      - name: Install
        run: npm ci
        working-directory: ${{ github.workspace }}

      # Idempotency guard. A publish job that red-Xes on every unrelated push
      # to main trains people to ignore CI, so an already-published version is
      # a clean skip, not a failure.
      #
      # The skip path should be rare for pushes that touch the package: the PR
      # gate (design-system-pr.yml) fails any PR that changes this package
      # without bumping `version`, precisely so a merge to main never lands
      # here with a stale version and silently publishes nothing. This guard is
      # also what makes the coexistence in the header safe: each publish
      # workflow only ever acts on its own package.json's exact version.
      #
      # `npm view` exits non-zero when the version does not exist (E404) —
      # which is the normal "please publish" case — so the exit code is
      # swallowed and the decision is made on whether stdout came back empty.
      # stderr is discarded: on auth trouble npm can echo the request headers.
      - name: Check whether this version is already published
        id: check
        run: |
          set -uo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "Resolved package: $NAME@$VERSION"

          PUBLISHED="$(npm view "$NAME@$VERSION" version 2>/dev/null || true)"

          if [ -n "$PUBLISHED" ]; then
            echo "$NAME@$VERSION is already in the registry — nothing to do."
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is not in the registry — will publish."
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # NO BUILD STEP, deliberately — do not "fix" this by adding tsup back.
      # The old package shipped `dist/`; this one publishes SOURCE (.ts/.tsx),
      # because the platform-split pattern depends on it: each component's
      # `.web.tsx` and `.native.tsx` leaves must survive into the published
      # artifact so the CONSUMER's bundler picks the leaf by extension —
      # marketing's Vite (via `ssr.noExternal` + `resolve.extensions`) takes
      # `.web.tsx`, the app's Metro takes `.native.tsx`. A package-time bundle
      # step would collapse that choice before any consumer gets to make it.
      - name: Publish to GitHub Packages
        if: steps.check.outputs.should-publish == 'true'
        run: npm publish

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.should-publish }}" = "true" ]; then
            echo "Published ${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped: ${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }} was already published." >> "$GITHUB_STEP_SUMMARY"
          fi
