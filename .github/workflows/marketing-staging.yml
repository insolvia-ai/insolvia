name: Marketing · Deploy · Staging

# Deploys staging-www.insolvia.ai: SSR Lambda image + hashed client assets on
# S3, both behind one CloudFront distribution (infra/modules/marketing_site).
#
# Staging exists because the SES production-access request (issue #80 / 6.8)
# is reviewed against a live privacy policy and a working unsubscribe path,
# which need somewhere to be exercised before prod serves them. This reverses
# decision D2 ("production + PR previews only", issue #45); the PR previews D2
# leaned on were never built. See infra/envs/staging/main.tf and
# docs/plan.md.
#
# Staging serves a full public copy of the site, and that is safe for SEO only
# because the app noindexes every host that is not exactly www.insolvia.ai
# (app/lib/seo.ts, issue #48) — staging robots.txt is `Disallow: /`. The smoke
# check below asserts that, because a staging copy that started ranking would
# compete with production for its own keywords.
#
# FIRST-EVER DEPLOY (bootstrap — manual, once): the SSR Lambda cannot be
# created until an image exists in the ECR repository. The repository is not
# created by this env — `insolvia-marketing` is shared across environments and
# lives in infra/envs/shared, applied first (see
# infra/modules/marketing_site/main.tf):
#
#   terraform -chdir=infra/envs/shared apply     # creates insolvia-marketing
#   # build the app, docker build, push <marketing_ecr_repository_url>:staging
#   terraform -chdir=infra/envs/staging apply
#
# After that the Lambda's image_uri is lifecycle-ignored and this workflow owns
# the running image via `aws lambda update-function-code`.
#
# Deploy workflows are not required status checks, so — unlike the *-pr.yml
# gates — a `paths:` filter here is safe (same as api-staging.yml).

on:
  # Reusable: release.yml calls this as one leg of a staging
  # release, and it stays dispatchable by hand for a single-service deploy.
  # The `push:` trigger moved to release.yml, which now owns both the
  # trigger and the path filtering for every staging deploy.
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  # The marketing site installs @insolvia-ai/design-system from GitHub Packages
  # by published version (it is deliberately outside the npm workspace, so it
  # does not get the symlink the app does — see the root package.json). The
  # job's GITHUB_TOKEN needs read access to pull it.
  #
  # release.yml must hold this too: a called workflow cannot request a
  # permission its caller lacks, and the whole run is rejected at startup.
  packages: read

# Held while this workflow deploys, and shared with infra-staging.yml so a
# hand-dispatched single-service deploy cannot overlap a Terraform apply.
# release.yml deliberately declares NO group of its own: a group on both
# caller and callee deadlocks, and `needs` already orders the legs.
concurrency:
  group: insolvia-terraform-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Required: environment-scoped secrets (AWS_ROLE_ARN) are invisible to jobs
    # that don't declare the environment — they resolve silently to "".
    environment: insolvia-staging
    steps:
      - uses: actions/checkout@v5

      # ── 1. Build the app ──────────────────────────────────────────
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/insolvia_marketing/package-lock.json

      # The only step that touches the network: the lockfile pins
      # @insolvia-ai/design-system to GitHub Packages, which requires a token
      # even for public packages (the app's .npmrc expands NODE_AUTH_TOKEN).
      - name: Install
        run: npm ci
        working-directory: apps/insolvia_marketing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build
        working-directory: apps/insolvia_marketing

      # ── 2. Infra: apply + read outputs ────────────────────────────
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"
          # The wrapper interleaves its own stdout, which corrupts
          # `$(terraform output -raw ...)` capture below.
          terraform_wrapper: false

      - name: Read staging infra outputs
        id: tf
        run: |
          terraform -chdir=infra/envs/staging init -input=false
          tf() { terraform -chdir=infra/envs/staging output -raw "$1"; }
          {
            echo "ecr=$(tf marketing_ecr_repository_url)"
            echo "lambda=$(tf marketing_ssr_function_name)"
            echo "bucket=$(tf marketing_assets_bucket_name)"
            echo "dist=$(tf marketing_distribution_id)"
            echo "url=$(tf marketing_url)"
            echo "alias=$(tf marketing_ssr_alias_name)"
          } >> "$GITHUB_OUTPUT"

      # ── 3. SSR image → ECR ────────────────────────────────────────
      - uses: aws-actions/amazon-ecr-login@v2

      - name: Docker build + push
        env:
          IMAGE: ${{ steps.tf.outputs.ecr }}
        run: |
          docker build -t "$IMAGE:sha-${{ github.sha }}" -t "$IMAGE:staging" .
          docker push "$IMAGE:sha-${{ github.sha }}"
          docker push "$IMAGE:staging"
        working-directory: apps/insolvia_marketing

      # ── 4. Client assets → S3 (BEFORE the code that references them) ──
      # Ordering is load-bearing: build/client filenames are content-hashed and
      # the SSR bundle references those exact names, so the assets must be in
      # place before the Lambda that asks for them starts serving. The reverse
      # order leaves a window where every /assets/* 404s.
      #
      # ADDITIVE — no `--delete`, deliberately. Until step 5 shifts the alias
      # the OLD bundle is still serving and still referencing its own asset
      # filenames; deleting them would 404 anyone mid-session. Content-hashed
      # names cannot collide, so old and new coexist and superseded files age
      # out. HTML is SSR'd by the Lambda, so unlike app-staging.yml there is no
      # second no-cache HTML pass.
      - name: Sync assets to S3 + invalidate
        env:
          BUCKET: ${{ steps.tf.outputs.bucket }}
          DIST: ${{ steps.tf.outputs.dist }}
        run: |
          aws s3 sync apps/insolvia_marketing/build/client "s3://$BUCKET" \
            --cache-control "public,max-age=31536000,immutable"
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"

      # ── 5. Point the Lambda at the new image ──────────────────────
      - name: Update Lambda function code
        env:
          FUNCTION: ${{ steps.tf.outputs.lambda }}
          IMAGE: ${{ steps.tf.outputs.ecr }}
          ALIAS: ${{ steps.tf.outputs.alias }}
        run: |
          # `environment` on this Lambda is Terraform-owned (no SSM re-derive
          # step, unlike the API), so publishing here snapshots a coherent
          # code+config pair.
          version="$(aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --image-uri "$IMAGE:sha-${{ github.sha }}" \
            --publish \
            --query Version --output text)"
          aws lambda wait function-updated --function-name "$FUNCTION"

          # Staging publishes and shifts in one go — it is the proving ground,
          # and a failed smoke check below turns the run red. Production does
          # the opposite (smoke-test the new version first, shift only on
          # success) so a bad build never reaches live traffic there.
          aws lambda update-alias \
            --function-name "$FUNCTION" \
            --name "$ALIAS" \
            --function-version "$version"
          echo "Staging now serving version $version via alias $ALIAS." >> "$GITHUB_STEP_SUMMARY"

      # ── 6. Smoke check ────────────────────────────────────────────
      # Unlike prod there is no apex to assert (staging owns no apex — see
      # infra/envs/staging/main.tf). Instead assert the thing that is specific
      # to a second public copy of the site: it must not be crawlable.
      - name: Smoke check
        env:
          URL: ${{ steps.tf.outputs.url }}
        run: |
          curl -sSf -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors "$URL/"
          robots=$(curl -sSf "$URL/robots.txt")
          if ! grep -q '^Disallow: /$' <<< "$robots"; then
            echo "::error::staging robots.txt is not Disallow: / — a crawlable staging copy competes with production"
            echo "$robots"
            exit 1
          fi
          if ! curl -sSf "$URL/" | grep -qi 'name="robots" content="noindex'; then
            echo "::error::staging pages are missing the noindex meta tag (see app/lib/seo.ts isProductionHost)"
            exit 1
          fi
