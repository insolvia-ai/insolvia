name: Desktop artifact names
description: >-
  Compute the filenames for the unsigned desktop artifacts (.dmg / setup.exe)
  for a given environment, so the naming convention has exactly one owner.

# WHY THIS EXISTS
#
# The Flutter app compiles its environment IN
# (`--dart-define=INSOLVIA_ENV`, see apps/insolvia_app/lib/src/config/
# environment.dart), so a staging .dmg and a production .dmg are different
# products that look identical in a Downloads folder. Handing a design partner
# the wrong one is a silent, plausible, and fairly bad mistake — the app would
# talk to the wrong API. Every artifact therefore carries its environment in
# the filename, and this action is the single place that spelling is decided.
# It is used by app-staging.yml and app-prod.yml (which upload) and could be
# used by anything that needs to predict a URL.
#
# Two names per platform, on purpose:
#
#   • the VERSIONED name embeds version + short commit, so its bytes never
#     change and it can be cached forever (`immutable`), exactly like the
#     hashed web assets in the same workflows;
#   • the LATEST alias is a stable, memorable URL to actually hand someone —
#     it is overwritten on every deploy and therefore must be served
#     `no-cache`, exactly like index.html in the same workflows.
#
# Getting that pairing wrong in the other direction (immutable cache on a
# mutable key) would pin a stale installer in CloudFront for a year.

inputs:
  env:
    description: "Environment the build targets: staging | production."
    required: true
  sha:
    description: >-
      Commit the artifact was built from. Defaults to the running commit;
      app-prod.yml passes the verified commit it checked out instead, which is
      not necessarily github.sha.
    required: false
    default: ""
  pubspec:
    description: "Path to the app pubspec, read for the version."
    required: false
    default: "apps/insolvia_app/pubspec.yaml"

outputs:
  version:
    description: "App version from pubspec.yaml, build number stripped (e.g. 0.1.0)."
    value: ${{ steps.names.outputs.version }}
  short_sha:
    description: "Seven-character commit prefix embedded in the versioned names."
    value: ${{ steps.names.outputs.short_sha }}
  dmg:
    description: "Versioned, immutable macOS filename."
    value: ${{ steps.names.outputs.dmg }}
  exe:
    description: "Versioned, immutable Windows installer filename."
    value: ${{ steps.names.outputs.exe }}
  dmg_latest:
    description: "Stable macOS alias filename, overwritten every deploy."
    value: ${{ steps.names.outputs.dmg_latest }}
  exe_latest:
    description: "Stable Windows alias filename, overwritten every deploy."
    value: ${{ steps.names.outputs.exe_latest }}
  installer_base:
    description: >-
      OutputBaseFilename to pass to Inno Setup — the versioned Windows name
      without its .exe suffix, since iscc appends that itself.
    value: ${{ steps.names.outputs.installer_base }}

runs:
  using: composite
  steps:
    - id: names
      shell: bash
      env:
        ENV_NAME: ${{ inputs.env }}
        INPUT_SHA: ${{ inputs.sha }}
        PUBSPEC: ${{ inputs.pubspec }}
      run: |
        set -euo pipefail

        case "${ENV_NAME}" in
          staging|production) ;;
          *)
            # Never guess. A mislabelled artifact is the exact failure this
            # action exists to prevent, so an unknown environment is fatal.
            echo "::error::Unknown environment '${ENV_NAME}' (expected staging or production)." >&2
            exit 1
            ;;
        esac

        sha="${INPUT_SHA:-${GITHUB_SHA}}"
        short_sha="${sha:0:7}"

        # `version: 0.1.0+1` -> `0.1.0`. The +build suffix is dropped because
        # Inno Setup's VersionInfoVersion only accepts dotted numerals.
        version="$(sed -n 's/^version:[[:space:]]*\([^[:space:]]*\).*/\1/p' "${PUBSPEC}" | head -n1)"
        version="${version%%+*}"
        if [ -z "${version}" ]; then
          echo "::error::Could not read a version from ${PUBSPEC}." >&2
          exit 1
        fi

        stem="insolvia_app-${ENV_NAME}-${version}-${short_sha}"
        latest="insolvia_app-${ENV_NAME}-latest"

        {
          echo "version=${version}"
          echo "short_sha=${short_sha}"
          echo "dmg=${stem}.dmg"
          echo "exe=${stem}-setup.exe"
          echo "dmg_latest=${latest}.dmg"
          echo "exe_latest=${latest}-setup.exe"
          echo "installer_base=${stem}-setup"
        } >> "${GITHUB_OUTPUT}"

        echo "Artifact names for ${ENV_NAME} @ ${short_sha} (v${version}):"
        echo "  ${stem}.dmg        -> ${latest}.dmg"
        echo "  ${stem}-setup.exe  -> ${latest}-setup.exe"
