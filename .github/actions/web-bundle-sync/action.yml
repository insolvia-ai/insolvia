name: Web bundle sync
description: >-
  Upload a built Flutter web bundle to its S3 bucket with the right
  Cache-Control on every class of object, then invalidate CloudFront — so the
  caching rules have exactly one owner.

# WHY THIS EXISTS
#
# Issue #49. app-staging.yml and app-prod.yml each carried their own copy of
# the sync, and both split on `*.html` alone: HTML was never cached, and
# *everything else* went up `immutable` for a year. The comment above it called
# that everything-else "hashed assets". It isn't.
#
# Flutter web content-hashes NOTHING. Every filename it emits is stable across
# builds while the bytes behind it change every deploy:
#
#     main.dart.js            the whole app — changes on every deploy
#     flutter_bootstrap.js    loader + build config — every deploy
#     flutter_service_worker.js                     — every deploy
#     version.json                                  — every deploy
#     flutter.js              changes on a Flutter SDK bump
#     manifest.json           PWA manifest
#     assets/AssetManifest.*, assets/FontManifest.json, assets/NOTICES
#
# CloudFront is invalidated on every deploy, so the edge was always fine. A
# returning BROWSER was not: `immutable` tells it not to revalidate for a year,
# and no invalidation can reach a client-side cache. Such a client stays pinned
# to a whole old build.
#
# This is not a Flutter misconfiguration we could fix in the build. Flutter's
# own web FAQ states it outright — "Flutter doesn't currently support appending
# build IDs to resources automatically" — and `flutter build web --help` offers
# no hashing flag. Flutter used to compensate with a service worker that carried
# a per-file MD5 manifest; that was deliberately retired (flutter/flutter#156910),
# and `flutter_service_worker.js` is now an 800-byte tombstone that unregisters
# itself. Per the announcement, apps "stop using the Service Worker-managed
# caches, and start using the default browser cache". These headers are
# therefore not a backstop behind some other mechanism. They are the ONLY one.
#
# THREE TIERS, not two. Values follow the Flutter web FAQ's own recommendation:
#
#   1. Static payloads (`public,max-age=3600,s-maxage=604800`) — fonts, shaders,
#      icons, favicon, canvaskit/. Their bytes are stable between Flutter SDK
#      bumps, but the NAMES still aren't content-addressed, so an SDK upgrade
#      can hand a returning browser a new manifest against a year-old font or
#      shader. One hour in the browser bounds that; a week at the CDN keeps it
#      cheap. (An earlier draft used `max-age=31536000` here. Same class of bug
#      as the one being fixed, just rarer — don't reintroduce it.)
#
#   2. Revalidate-always (`no-cache`) — the unhashed entrypoints above.
#      `no-cache` does NOT mean "don't store": the browser keeps the bytes and
#      revalidates with its ETag, so an unchanged multi-megabyte main.dart.js
#      costs one 304 instead of a re-download. Correct AND fast; this is why the
#      entrypoints do not simply reuse the HTML header below.
#
#      The FAQ suggests `max-age=0,s-maxage=604800` for this class. We go
#      stricter and skip `s-maxage` on purpose: the invalidation below is issued
#      fire-and-forget, so an edge told to hold these for a week is stale for
#      however long the invalidation takes to propagate. `no-cache` makes the
#      edge revalidate and needs no invalidation to be correct. Cheap here —
#      it costs conditional GETs against S3, which this traffic volume will not
#      notice.
#
#   3. Never stored (`no-cache,no-store,must-revalidate`) — the HTML shell.
#      Tiny, and also served for every SPA deep link via the 403/404 rewrite, so
#      it is the one thing that must never live in any cache.
#
# Tiers 2 and 3 are floored at 1 second of edge caching regardless: the managed
# CachingOptimized policy on these distributions has a Min TTL of 1s, which
# overrides `no-cache`/`no-store` from the origin. Immaterial, but it is why an
# `x-cache: Hit` on index.html is not automatically a bug.
#
# Order matters: dependencies land before the entrypoints that name them, and
# HTML lands last, so a bundle is never referenced before it exists.
#
# On the objects ALREADY in the bucket carrying the old `immutable` header:
# `aws s3 sync` skips a file only when it is no newer than its destination, and
# these jobs upload straight out of a fresh CI build, so every local mtime beats
# the deployed object and the whole tree re-uploads with corrected headers on
# the first deploy after this lands. Nothing has to be purged by hand.
#
# Used by app-staging.yml and app-prod.yml. Verifying the result by hand:
# docs/APP_DEPLOY_VERIFICATION.md, Part 1 check 6.

inputs:
  dir:
    description: "Directory holding the built web bundle (the `build/web` contents)."
    required: true
  bucket:
    description: "Destination S3 bucket name, without the s3:// scheme."
    required: true
  distribution-id:
    description: "CloudFront distribution to invalidate once the upload is complete."
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SRC: ${{ inputs.dir }}
        BUCKET: ${{ inputs.bucket }}
        DIST: ${{ inputs.distribution-id }}
      run: |
        set -euo pipefail

        # The unhashed entrypoints — tier 2. `main.dart.js*` is a glob on
        # purpose: it also catches the `main.dart.js_N.part.js` files that
        # appear as soon as anyone adds a deferred import, which are just as
        # unhashed and just as per-build as the bundle itself.
        entrypoints=(
          "flutter_bootstrap.js"
          "flutter.js"
          "main.dart.js*"
          "flutter_service_worker.js"
          "version.json"
          "manifest.json"
          "assets/AssetManifest.bin"
          "assets/AssetManifest.bin.json"
          "assets/FontManifest.json"
          "assets/NOTICES"
        )

        skip_entrypoints=()
        only_entrypoints=("--exclude" "*")
        for pattern in "${entrypoints[@]}"; do
          skip_entrypoints+=("--exclude" "${pattern}")
          only_entrypoints+=("--include" "${pattern}")
        done

        # 1. Long-lived payloads, first, and the only pass that prunes. Note
        #    that `--delete` ignores excluded keys, so it prunes exactly the
        #    tier this pass owns — which is the tier that actually accumulates
        #    orphans when an asset is renamed or removed. The entrypoint and
        #    HTML names are a fixed set Flutter always emits, so they have
        #    nothing to prune.
        aws s3 sync "$SRC" "s3://$BUCKET" --delete \
          --cache-control "public,max-age=3600,s-maxage=604800" \
          --exclude "*.html" "${skip_entrypoints[@]}"

        # 2. Unhashed entrypoints: cached, but revalidated on every request.
        aws s3 sync "$SRC" "s3://$BUCKET" \
          --cache-control "no-cache" \
          "${only_entrypoints[@]}"

        # 3. HTML last, never stored, so a new deploy is picked up immediately.
        aws s3 sync "$SRC" "s3://$BUCKET" \
          --cache-control "no-cache,no-store,must-revalidate" \
          --exclude "*" --include "*.html"

        aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"
