name: Seed staging
description: >-
  Converge staging's test accounts, firms and fixture cases on seeds/staging.json,
  idempotently, before a suite that depends on them runs — by invoking the
  migrator Lambda's `seed` command.

# WHY A SHARED STEP
#
# Two post-deploy suites sign in as the people seeds/staging.json names: the
# contract suite's deployed target (api-staging.yml, after the alias shift) and the
# browser suite (app-staging.yml, after the CloudFront invalidation). Both need
# the same accounts, the same firms and the same fixture case to exist, and
# the loader converges rather than creates, so running it again is a fast
# no-op. One action keeps the two callers from drifting into two slightly
# different seed steps.
#
# WHERE THE SEED RUNS NOW (ADR 0028, plan 18.22)
#
# Not on the runner. The data is in Aurora, in private subnets a GitHub
# runner cannot reach, so the loader is backend/src/Insolvia.Migrator's
# `seed` command running INSIDE the VPC as the staging migrator Lambda
# (infra/modules/migrator) — which already seeded once this release, in the
# migrator leg's `{}` run. This step invokes `{"command": "seed"}` and checks
# the answer. What the seed may touch is that Lambda's role: the database as
# the `migrator` Postgres role (INSERT/SELECT and a store's UPDATEs, never
# DELETE), the firm pool's test accounts, server-side copies from the shared
# fixture bucket into staging's case-documents bucket, and the case key for
# both. The runner holds none of it; it holds lambda:InvokeFunction, which
# the deploy role (AWS_ROLE_ARN) already has on insolvia-* functions.
#
# The staging seed ROLE (insolvia-services' ci-trust, AWS_SEED_ROLE_ARN) is
# therefore unused from the switch on; insolvia-services retires it.
#
# THE CALLING JOB SHOULD DECLARE `environment: insolvia-staging`. AWS_ROLE_ARN
# is a repository secret today, but an environment-scoped secret is invisible
# without that key — it resolves to "" and the role assumption fails with
# "Could not load credentials from any providers", which names nothing — and
# the job it runs in is a staging deployment either way. The first step
# names a missing input instead. The test users' password is NOT an input
# any more: the migrator deploy (migrator-staging.yml) put
# E2E_TEST_USER_PASSWORD in the Lambda's environment.
#
# If the copy of a fixture document is refused, the fixture version has not
# been published (scripts/dev-fixture.sh publish).

inputs:
  role-arn:
    description: "secrets.AWS_ROLE_ARN — the deploy role, which may invoke the migrator Lambda"
    required: true
  migrator-function:
    description: "Terraform output migrator_function_name"
    required: true

runs:
  using: composite
  steps:
    - name: Check the seed step has its inputs
      shell: bash
      env:
        ROLE_ARN: ${{ inputs.role-arn }}
        FUNCTION: ${{ inputs.migrator-function }}
      run: |
        missing=()
        [ -n "$ROLE_ARN" ] || missing+=(AWS_ROLE_ARN)
        [ -n "$FUNCTION" ] || missing+=(migrator_function_name)
        if [ ${#missing[@]} -ne 0 ]; then
          echo "::error::Seed inputs missing: ${missing[*]}"
          echo "A secret name means it is unset on the insolvia-staging environment, or"
          echo "the calling job lost its 'environment: insolvia-staging' key — an"
          echo "environment-scoped secret resolves to an empty string in silence."
          echo "An output name means the terraform job did not read it."
          exit 1
        fi

    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: us-east-1

    # Accounts, firms AND cases, from one fixture. Adding a test user or a
    # fixture case is an edit to seeds/ — which rebuilds the migrator image
    # (the seeds are a named build context of backend/Dockerfile's migrator
    # stage), so the fixture the Lambda loads is the commit's own.
    - name: Seed the staging accounts, firms and fixture cases
      shell: bash
      env:
        FUNCTION: ${{ inputs.migrator-function }}
      run: |
        echo '{"command": "seed"}' > seed.json
        aws lambda invoke \
          --function-name "$FUNCTION" \
          --payload fileb://seed.json \
          --cli-read-timeout 900 \
          seed-response.json > seed-meta.json
        cat seed-meta.json
        if jq -e '.FunctionError' seed-meta.json > /dev/null; then
          echo "::error::The seed raised: $(jq -r '.errorMessage // .' seed-response.json)"
          cat seed-response.json
          exit 1
        fi
        jq -r '(.Lines // .lines // [])[]' seed-response.json
        code="$(jq -r '.ExitCode // .exitCode // "missing"' seed-response.json)"
        if [ "$code" != "0" ]; then
          echo "::error::The seed answered exit code $code."
          exit 1
        fi
