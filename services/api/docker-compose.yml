# Local dev for services/api — `./services/api/scripts/dev-up.sh`, then
# `curl http://127.0.0.1:8080/health`.
#
# There is no local DynamoDB emulator: the container talks to this machine's
# REAL per-developer AWS case store (infra/envs/dev), provisioned by
# ./scripts/dev-aws-setup.sh. That script writes services/api/.env
# (gitignored), which compose auto-reads for the ${VAR:-default}
# substitutions below — CASE_TABLE_NAME names the per-machine table. The
# firm stores, portal bindings and waitlist are in the Postgres below.
#
# AWS credentials are not environment values: scripts/dev-up.sh keeps a
# refreshed process-format credentials file, and a config whose
# credential_process reads it, in ~/.cache/insolvia/aws-container/api — the
# directory mounted read-only below. botocore re-runs the process before each
# set expires, so the container outlives any one set. Without dev-up.sh the
# directory is empty and the container simply has no AWS credentials.
#
# Postgres 17 (ADR 0030) runs here, in Docker, for every service on this
# machine: `migrate` applies insolvia_core's numbered migrations to it before
# the API starts, so `up` always means a migrated database. Its data lives in
# the `postgres-data` volume and survives `down`; `down -v` empties it. The
# credentials are local-only throwaways, published on 127.0.0.1 alone.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: insolvia
      POSTGRES_PASSWORD: insolvia
      POSTGRES_DB: insolvia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "insolvia", "-d", "insolvia"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      target: development
    command: ["python", "-m", "insolvia_core.adapters.postgres.migrations"]
    environment:
      DATABASE_URL: postgresql://insolvia:insolvia@postgres:5432/insolvia
    depends_on:
      postgres:
        condition: service_healthy

  api:
    depends_on:
      migrate:
        condition: service_completed_successfully
    build:
      # The repo root, not this directory: the image installs the shared
      # packages/insolvia_core by relative path (see the Dockerfile header).
      context: ../..
      dockerfile: services/api/Dockerfile
      target: development
    environment:
      INSOLVIA_ENV: ${INSOLVIA_ENV:-local}
      # Required: unset, the service refuses to start (ADR 0030).
      DATABASE_URL: postgresql://insolvia:insolvia@postgres:5432/insolvia
      # Case store (issue 8.2). Encrypted under this machine's own
      # customer-managed key, so a KMS permission mistake surfaces here
      # rather than on staging.
      CASE_TABLE_NAME: ${CASE_TABLE_NAME:-}
      # Append-only access log (issue 8.3): who read which case. The API can
      # write it and, by IAM, can never read it back.
      CASE_ACCESS_LOG_TABLE_NAME: ${CASE_ACCESS_LOG_TABLE_NAME:-}
      # Case documents (issue 8.6). This machine's real bucket, under the same
      # customer-managed key as the table — there is no S3 emulator, and the
      # presigned URLs the API mints are signed against this bucket, so a
      # KMS or bucket-policy mistake surfaces here rather than on staging.
      CASE_DOCUMENT_BUCKET: ${CASE_DOCUMENT_BUCKET:-}
      # Auth (issue #79). Unset is safe and fails CLOSED: every protected
      # route answers 401 rather than skipping verification. Point them at
      # this machine's own Cognito pool (infra/envs/dev outputs
      # auth_issuer_url / auth_web_client_id) to exercise a real sign-in.
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-}
      # The client portal's app client (ADR 0023): every /v1/portal/ route
      # verifies it and only it. dev-aws-setup.sh writes it; unset, portal
      # routes answer 401 and staff routes are untouched.
      AUTH_PORTAL_CLIENT_ID: ${AUTH_PORTAL_CLIENT_ID:-}
      # Unset records mail in memory. Set it to the local mailer
      # (http://host.docker.internal:8026) to see the portal invitation's
      # context mail in Mailpit at http://127.0.0.1:8025. The mailer is the
      # insolvia-services repo's: ./scripts/dev-up.sh starts it from a sibling
      # checkout, or run its services/mailer/scripts/dev-up.sh there.
      MAILER_API_URL: ${MAILER_API_URL:-}
      # The pool POST /v1/firm/users CALLS (AUTH_ISSUER_URL is what tokens are
      # verified against); unset means the in-memory directory.
      AUTH_USER_POOL_ID: ${AUTH_USER_POOL_ID:-}
      # Job pipeline (ADR 0018): this machine's real queue. Accepted jobs land
      # there and run when the worker poller is running
      # (`python -m insolvia_api.entrypoints.worker_poller`, same .env);
      # unset composes the in-memory queue, which records and runs nothing.
      JOB_QUEUE_URL: ${JOB_QUEUE_URL:-}
      # The filing queue (ADR 0024 PR 6): an approval's one filing job lands
      # on this machine's real queue (no consumer until PR 7). Unset composes
      # the in-memory queue, which records the job and sends nothing.
      FILING_QUEUE_URL: ${FILING_QUEUE_URL:-}
      AWS_CONFIG_FILE: /run/insolvia-aws/config
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ${HOME}/.cache/insolvia/aws-container/api:/run/insolvia-aws:ro
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
