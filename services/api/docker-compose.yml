# Local dev for services/api — `./services/api/scripts/dev-up.sh`, then
# `curl http://127.0.0.1:8080/health`.
#
# There is no local DynamoDB emulator: the container talks to this machine's
# REAL per-developer AWS tables — the waitlist table and the case store
# (infra/envs/dev), provisioned by ./scripts/dev-aws-setup.sh. That script
# writes services/api/.env (gitignored), which compose auto-reads for the
# ${VAR:-default} substitutions below — WAITLIST_TABLE_NAME and
# CASE_TABLE_NAME name the per-machine tables.
#
# AWS credentials are never written to a file: scripts/dev-up.sh exports
# short-lived credentials from the developer's AWS profile into the shell
# before `up` (shell env beats .env in compose substitution) and
# force-recreates the container so it can never keep an expired set. The
# ${VAR:-} forms below just pass that shell environment through.
services:
  api:
    build:
      # The repo root, not this directory: the image installs the shared
      # packages/insolvia_core by relative path (see the Dockerfile header).
      context: ../..
      dockerfile: services/api/Dockerfile
      target: development
    environment:
      INSOLVIA_ENV: ${INSOLVIA_ENV:-local}
      WAITLIST_TABLE_NAME: ${WAITLIST_TABLE_NAME:-}
      # Case store (issue 8.2). Encrypted under this machine's own
      # customer-managed key, so a KMS permission mistake surfaces here
      # rather than on staging.
      CASE_TABLE_NAME: ${CASE_TABLE_NAME:-}
      # Append-only access log (issue 8.3): who read which case. The API can
      # write it and, by IAM, can never read it back.
      CASE_ACCESS_LOG_TABLE_NAME: ${CASE_ACCESS_LOG_TABLE_NAME:-}
      # Case documents (issue 8.6). This machine's real bucket, under the same
      # customer-managed key as the table — there is no S3 emulator, and the
      # presigned URLs the API mints are signed against this bucket, so a
      # KMS or bucket-policy mistake surfaces here rather than on staging.
      CASE_DOCUMENT_BUCKET: ${CASE_DOCUMENT_BUCKET:-}
      # Firm store (ADR 0009 tenancy), read on every authenticated request.
      # Unset composes the empty IN-MEMORY store, so a seeded, signed-in user
      # still 403s "not active in a firm" — the seeder writes the real table.
      FIRM_TABLE_NAME: ${FIRM_TABLE_NAME:-}
      # Auth (issue #79). Unset is safe and fails CLOSED: every protected
      # route answers 401 rather than skipping verification. Point them at
      # this machine's own Cognito pool (infra/envs/dev outputs
      # auth_issuer_url / auth_web_client_id) to exercise a real sign-in.
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-}
      # The pool POST /v1/firm/users CALLS (AUTH_ISSUER_URL is what tokens are
      # verified against); unset means the in-memory directory.
      AUTH_USER_POOL_ID: ${AUTH_USER_POOL_ID:-}
      # Job pipeline (ADR 0018): this machine's real queue. Accepted jobs land
      # there and run when the worker poller is running
      # (`python -m insolvia_api.entrypoints.worker_poller`, same .env);
      # unset composes the in-memory queue, which records and runs nothing.
      JOB_QUEUE_URL: ${JOB_QUEUE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "127.0.0.1:8080:8080"
