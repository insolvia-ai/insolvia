# Local dev for services/api — `./services/api/scripts/dev-up.sh`, then
# `curl http://127.0.0.1:8080/health`.
#
# No AWS but Cognito (#624, ADR 0030 row 5). Everything the API stores is in
# this stack: Postgres for every table, and an S3-compatible server for the
# case documents. Jobs (packets, extraction) run on the API's own in-process
# queue, and tax ids and filing credentials seal under the development-only
# key, which the API refuses to compose outside INSOLVIA_ENV=local. The one
# AWS service left is the shared dev Cognito pool: services/api/.env's
# AUTH_* values (scripts/dev-aws-seed.sh writes them, once, from SSM) point
# token verification at it, and verifying a token needs no AWS credentials.
#
# Every credential here is a local-only throwaway, published on 127.0.0.1
# alone. Postgres keeps its data in the `postgres-data` volume and the
# documents in `s3-data`; both survive `down`, and `down -v` empties them.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: insolvia
      POSTGRES_PASSWORD: insolvia
      POSTGRES_DB: insolvia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "insolvia", "-d", "insolvia"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      target: development
    command: ["python", "-m", "insolvia_core.adapters.postgres.migrations"]
    environment:
      DATABASE_URL: postgresql://insolvia:insolvia@postgres:5432/insolvia
    depends_on:
      postgres:
        condition: service_healthy

  # The case-documents bucket's stand-in. RustFS, not MinIO: MinIO no longer
  # publishes community images. Presigned URLs are signed for the browser's
  # address (localhost:9000), and the server checks them, so the signed size
  # and content type are enforced here as S3 enforces them.
  s3:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: insolvia
      RUSTFS_SECRET_KEY: insolvia-local
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - s3-data:/data

  # Creates the bucket and the CORS rule the browser's direct upload needs
  # (a deployed bucket's CORS is infra/modules/case_documents'). Idempotent.
  s3-bucket:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      target: development
    command:
      - python
      - -c
      - |
        import time, boto3
        s3 = boto3.client("s3", endpoint_url="http://s3:9000")
        bucket = "insolvia-local-case-documents"
        for attempt in range(30):
            try:
                if bucket not in [b["Name"] for b in s3.list_buckets()["Buckets"]]:
                    s3.create_bucket(Bucket=bucket)
                break
            except Exception:
                time.sleep(1)
        else:
            raise SystemExit("the local S3 server never answered")
        s3.put_bucket_cors(Bucket=bucket, CORSConfiguration={"CORSRules": [{
            "AllowedOrigins": ["http://localhost:3000"],
            "AllowedMethods": ["GET", "PUT"],
            "AllowedHeaders": ["*"],
            "ExposeHeaders": ["ETag"],
        }]})
    environment:
      AWS_ACCESS_KEY_ID: insolvia
      AWS_SECRET_ACCESS_KEY: insolvia-local
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      - s3

  api:
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3-bucket:
        condition: service_completed_successfully
    build:
      # The repo root, not this directory: the image installs the shared
      # packages/insolvia_core by relative path (see the Dockerfile header).
      context: ../..
      dockerfile: services/api/Dockerfile
      target: development
    environment:
      INSOLVIA_ENV: local
      # Required: unset, the service refuses to start (ADR 0030).
      DATABASE_URL: postgresql://insolvia:insolvia@postgres:5432/insolvia
      # Case documents (issue 8.6) on the local S3 server: this container
      # reaches it as s3:9000, the browser as localhost:9000.
      CASE_DOCUMENT_BUCKET: insolvia-local-case-documents
      CASE_DOCUMENT_ENDPOINT_URL: http://s3:9000
      CASE_DOCUMENT_PUBLIC_ENDPOINT_URL: http://localhost:9000
      # The local S3 server's throwaways. Nothing else in this container calls
      # AWS: there are no other credentials to collide with.
      AWS_ACCESS_KEY_ID: insolvia
      AWS_SECRET_ACCESS_KEY: insolvia-local
      AWS_DEFAULT_REGION: us-east-1
      # Auth (issue #79): the shared dev pool. Unset is safe and fails CLOSED:
      # every protected route answers 401 rather than skipping verification.
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-}
      # The client portal's app client (ADR 0023): every /v1/portal/ route
      # verifies it and only it. Unset, portal routes answer 401.
      AUTH_PORTAL_CLIENT_ID: ${AUTH_PORTAL_CLIENT_ID:-}
      # Unset records mail in memory. Set it to the local mailer
      # (http://host.docker.internal:8026) to see the portal invitation's
      # context mail in Mailpit at http://127.0.0.1:8025. The mailer is the
      # insolvia-services repo's: ./scripts/dev-up.sh starts it from a sibling
      # checkout, or run its services/mailer/scripts/dev-up.sh there.
      MAILER_API_URL: ${MAILER_API_URL:-}
      # The AI jobs' model; unset, they fail honestly with `not_configured`.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # No AUTH_USER_POOL_ID: inviting a colleague or a portal client uses
      # the in-memory directory, which mints a subject and creates no pool
      # user — creating one would need AWS credentials.
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
  s3-data:
