# Shared ruff config for every Python service in the monorepo.
# Mirrors the per-service CI `ruff check` / `ruff format --check` steps — the
# same rules run locally (pre-commit + dev-test.sh) and in CI.
target-version = "py311"
line-length = 88

[lint]
# Strict, curated rule set. Beyond the pyflakes/pycodestyle baseline this adds
# import sorting, bug patterns, modern-syntax upgrades, simplifications,
# comprehension and pytest style, ruff's own checks, and naming.
select = [
  "E", "W",   # pycodestyle errors + warnings
  "F",        # pyflakes
  "I",        # isort (import ordering)
  "B",        # flake8-bugbear (likely bugs)
  "UP",       # pyupgrade (modern syntax for the target version)
  "SIM",      # flake8-simplify
  "C4",       # flake8-comprehensions
  "PT",       # flake8-pytest-style
  "RUF",      # ruff-specific rules
  "N",        # pep8-naming
]

[lint.per-file-ignores]
# Tests may use assert-style and fixture patterns freely.
"tests/**" = ["S101"]
