[project]
name = "insolvia-core"
version = "0.1.0"
description = "The shared domain both Python services import — firms, auth, and their adapters (issue #208)"
requires-python = ">=3.12"
# Loose floors, not pins, deliberately: this package is installed only by this
# repo's own services, each of which pins the exact resolved version in its
# requirements.txt (boto3 and PyJWT are pinned there today). A second set of
# exact pins here would be a second truth to keep in step.
dependencies = [
  "boto3>=1.34",
  "PyJWT[crypto]>=2.8",
  # Already pulled in by PyJWT[crypto] for RS256; named directly because
  # adapters/envelope.py imports it by name for the tax-id envelope
  # (issue 13.12 / #382), and a dependency reached only transitively is one
  # an upstream extra can drop without warning.
  "cryptography>=42",
  # The Postgres adapters (ADR 0030). The binary extra bundles libpq, so
  # neither a laptop nor the Lambda image needs a system package for it.
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The py.typed marker is what lets a consumer's strict mypy see these types.
# The court registry (`courts.py`, ADR 0014's `courts/us-bankruptcy` series)
# ships INSIDE the wheel: every consumer installs this package non-editable
# by path, so a data file this list misses is a loader that works in this
# package's own tests and raises FileNotFoundError in every service. The
# filing authorization's text (`filing_authorization.py`, ADR 0024 guardrail
# 2) ships the same way, for the same reason.
# The migrations (ADR 0030) ship the same way: the runner reads them from
# the installed package, in the compose migrator and the migrator Lambda.
insolvia_core = [
  "py.typed",
  "regulatory/**/*.json",
  "agreements/**/*.txt",
  "adapters/postgres/migrations/*.sql",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
# Same guards as services/api's pyproject, for the same reasons: an
# unregistered mark or a typo in this block is an error, not a warning.
addopts = "-q --strict-markers --strict-config"
markers = []

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
