# Local hooks that mirror the PR checks. scripts/dev-setup.sh installs them
# (both hook types); by hand:
#   brew install pre-commit && pre-commit install --hook-type pre-commit --hook-type pre-push
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict

  # The JS/TS half.
  #
  # `language: system` (not `node`): pre-commit's own node environments would
  # install a SECOND copy of the toolchain, pinned separately from the
  # committed package-lock.json, and the two would drift into disagreeing about
  # formatting. These run the repo's own npm scripts against the repo's own
  # node_modules, so the hook and CI are the same command by construction.
  # `pass_filenames: false` because both scripts define their own scope.
  - repo: local
    hooks:
      # Prettier in --check mode, not --write: a hook that silently rewrites
      # files mid-commit hides the diff you are about to author. Run
      # `npm run format:write` when it complains.
      - id: npm-format
        name: prettier (npm run format)
        entry: npm run format
        language: system
        pass_filenames: false
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|md|ya?ml)$

      # ESLint, fanned out per workspace member by `--workspaces`.
      #
      # It MUST be invoked this way — never as a bare `eslint` with the repo
      # root as cwd. There is deliberately no `eslint.config.js` at the root:
      # the rules live in `eslint.base.js` and each workspace member
      # re-exports it. ESLint discovers a flat config by walking UP from its
      # cwd, so a root one is also found by every subdirectory with its own
      # ESLint setup (apps/insolvia_marketing today) and can break a config
      # this change never touched — it happened once, to a since-retired
      # package. Read eslint.base.js before changing this entry.
      - id: npm-lint
        name: eslint (npm run lint --workspaces)
        entry: npm run lint
        language: system
        pass_filenames: false
        files: \.(ts|tsx|js|jsx|mjs|cjs)$

      # ── The unit tier, at PUSH time ─────────────────────────────────────
      #
      # Tests are too slow for every commit and exactly right for every push:
      # a commit is a save point, a push is the moment the work leaves this
      # machine and a red PR check becomes the feedback loop. `stages:
      # [pre-push]` keeps this off the commit path; `pre-commit install` has
      # to have been run with `--hook-type pre-push` as well (dev-setup.sh
      # does both) or this entry simply never fires.
      #
      # The script reads the range being pushed from PRE_COMMIT_FROM_REF /
      # PRE_COMMIT_TO_REF and maps the changed files to the suites they could
      # have broken (its header owns the map) — so a push touching one
      # service pays for one service's tests and a docs-only push pays for
      # none. `pass_filenames: false` is load-bearing: pre-commit splits a
      # long file list across several invocations, and each would have run
      # the same suites again. `always_run` because with no filenames passed
      # the `files:` filter would otherwise decide the hook has nothing to do.
      # Unit only, by construction: nothing it runs needs AWS, a server, a
      # secret or the network. The integration tier is a differently named
      # script (services/api/scripts/dev-test-integration.sh) so a hook can
      # never reach for it by accident.
      - id: unit-tests
        name: unit tests for the areas this push touches (scripts/dev-test-unit.sh)
        entry: scripts/dev-test-unit.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  # Not hooked at commit time: `npm run typecheck` and `npm run test` are too
  # slow for every commit. `npm run ci` runs the whole npm gate (tokens:check,
  # format, lint, typecheck, test) — the same set the PR checks run. The unit
  # tier runs at PUSH time instead (the `unit-tests` hook above).
