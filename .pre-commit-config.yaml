# Local hooks that mirror the PR checks. Install with:
#   pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict

  # The JS/TS half.
  #
  # `language: system` (not `node`): pre-commit's own node environments would
  # install a SECOND copy of the toolchain, pinned separately from the
  # committed package-lock.json, and the two would drift into disagreeing about
  # formatting. These run the repo's own npm scripts against the repo's own
  # node_modules, so the hook and CI are the same command by construction.
  # `pass_filenames: false` because both scripts define their own scope.
  - repo: local
    hooks:
      # Prettier in --check mode, not --write: a hook that silently rewrites
      # files mid-commit hides the diff you are about to author. Run
      # `npm run format:write` when it complains.
      - id: npm-format
        name: prettier (npm run format)
        entry: npm run format
        language: system
        pass_filenames: false
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|md|ya?ml)$

      # ESLint, fanned out per workspace member by `--workspaces`.
      #
      # It MUST be invoked this way — never as a bare `eslint` with the repo
      # root as cwd. There is deliberately no `eslint.config.js` at the root:
      # the rules live in `eslint.base.js` and each workspace member
      # re-exports it. ESLint discovers a flat config by walking UP from its
      # cwd, so a root one is also found by every subdirectory with its own
      # ESLint setup (apps/insolvia_marketing today) and can break a config
      # this change never touched — it happened once, to a since-retired
      # package. Read eslint.base.js before changing this entry.
      - id: npm-lint
        name: eslint (npm run lint --workspaces)
        entry: npm run lint
        language: system
        pass_filenames: false
        files: \.(ts|tsx|js|jsx|mjs|cjs)$

  # Not hooked: `npm run typecheck` and `npm run test` are too slow for every
  # commit. `npm run ci` runs the whole npm gate (tokens:check, format, lint,
  # typecheck, test) — the same set the PR checks run.
