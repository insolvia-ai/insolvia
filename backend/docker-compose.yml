# The local .NET stack: Postgres 17, the migrator, then the API, the staff
# admin service and the MCP server.
#
#   docker compose -f backend/docker-compose.yml up --build
#   curl http://127.0.0.1:8080/health
#
# The migrator runs once per `up`, after Postgres is healthy and before the
# API starts: it applies EF migrations, (re)creates the per-service roles
# with the local role password below, and seeds seeds/dev.json. Running it
# again changes nothing.
#
# Port 8080 is the API's everywhere (ADR 0028, § Local). scripts/dev-up.sh
# runs this file through backend/scripts/dev-up.sh.
#
# backend/.env (written by scripts/dev-aws-setup.sh, gitignored) feeds the
# ${VAR:-default} substitutions below: the shared dev pool's issuer and
# client ids, so the app on :3000 signs in against this API, and
# INSOLVIA_SEED=false, because scripts/dev-aws-seed.sh is then the seeder
# (with the pool's REAL subjects). Without the file every value is empty: the
# protected routes fail closed (401) and the migrator seeds derived subjects
# for an offline look at the admin portal.
#
# Postgres listens on 127.0.0.1:55432, not 5432, so it never collides with a
# Postgres already installed on the machine. The credentials are fixed,
# local-only development values: the database holds nothing but what a
# developer puts in it, and is reachable from this machine alone. Deployed
# environments use IAM database authentication, never a password from here.
#
# Data lives in the named volume `insolvia-backend-pgdata`;
# `docker compose -f backend/docker-compose.yml down -v` wipes it.
name: insolvia-backend

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: insolvia
      POSTGRES_USER: insolvia
      POSTGRES_PASSWORD: insolvia-local-only
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U insolvia -d insolvia']
      interval: 2s
      timeout: 3s
      retries: 15

  # A one-shot: it exits 0 when the database is current, and the API waits
  # for that. It connects as the superuser because it creates roles, as the
  # deployed migrator connects as the RDS master user.
  #
  # It then SEEDS seeds/dev.json and the fixture versions it names (as the
  # `migrator` role; INSOLVIA_SEED=false skips it), and a second `up` writes
  # nothing. With no pool named the people's subjects are derived from their
  # addresses — rows for the admin portal to show, nobody to sign in as; run
  # the seeder by hand with AUTH_USER_POOL_ID for the shared dev pool
  # (backend/CLAUDE.md). The seeds arrive as a named build context: seeds/ is
  # outside this directory.
  migrator:
    build:
      context: .
      target: migrator-development
      additional_contexts:
        seeds: ../seeds
    environment:
      INSOLVIA_DB_CONNECTION_STRING: Host=postgres;Port=5432;Database=insolvia;Username=insolvia;Password=insolvia-local-only
      INSOLVIA_DB_ROLE_PASSWORD: insolvia-local-only
      INSOLVIA_ENV: ${INSOLVIA_ENV:-local}
      INSOLVIA_SEED: ${INSOLVIA_SEED:-true}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: development
    environment:
      INSOLVIA_ENV: ${INSOLVIA_ENV:-local}
      # The API connects as its own role, `api`, never as the superuser — the
      # same least privilege it has on Aurora through IAM. Setting it composes
      # the Postgres stores (ApiComposition); the user directory, sealing keys
      # and blob store stay local twins.
      INSOLVIA_DB_CONNECTION_STRING: Host=postgres;Port=5432;Database=insolvia;Username=api;Password=insolvia-local-only
      # Token verification against the shared dev pool (public values, from
      # backend/.env). Unset fails CLOSED: every protected route answers 401.
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-}
      AUTH_PORTAL_CLIENT_ID: ${AUTH_PORTAL_CLIENT_ID:-}
      # Unset records mail in memory. http://host.docker.internal:8026 is the
      # local mailer scripts/dev-up.sh starts from an insolvia-services checkout.
      MAILER_API_URL: ${MAILER_API_URL:-}
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      migrator:
        condition: service_completed_successfully

  # The staff admin service on 8090, as its own role `admin` (firms, firm
  # users, the append-only audit). GOOGLE_CLIENT_ID unset fails every staff
  # route closed; FIRM_USER_POOL_ID unset mints subjects and mails nothing.
  admin:
    build:
      context: .
      target: admin-development
    environment:
      INSOLVIA_ENV: ${INSOLVIA_ENV:-local}
      INSOLVIA_DB_CONNECTION_STRING: Host=postgres;Port=5432;Database=insolvia;Username=admin;Password=insolvia-local-only
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FIRM_USER_POOL_ID: ${FIRM_USER_POOL_ID:-}
    ports:
      - '127.0.0.1:8090:8090'
    depends_on:
      migrator:
        condition: service_completed_successfully

  # The MCP server on 8788 (its endpoint is http://127.0.0.1:8788/mcp), as
  # its own role `mcp` — SELECT on cases and firms, candidates only for
  # writes. AUTH_CLIENT_IDS is the shared dev pool's MCP harness allowlist
  # (claude + inspector, from backend/.env); unset, every call answers 401.
  # contract/scripts/dev-test.sh --target deployed signs in through the
  # inspector's client and calls every tool here.
  mcp:
    build:
      context: .
      target: mcp-development
    environment:
      INSOLVIA_ENV: ${INSOLVIA_ENV:-local}
      INSOLVIA_DB_CONNECTION_STRING: Host=postgres;Port=5432;Database=insolvia;Username=mcp;Password=insolvia-local-only
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-}
      AUTH_CLIENT_IDS: ${AUTH_CLIENT_IDS:-}
    ports:
      - '127.0.0.1:8788:8788'
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  pgdata:
    name: insolvia-backend-pgdata
