# The local .NET stack: Postgres 17, the migrator, then the API, the staff
# admin service and the MCP server.
#
#   docker compose -f backend/docker-compose.yml up --build
#   curl http://127.0.0.1:8080/health
#
# The migrator runs once per `up`, after Postgres is healthy and before the
# API starts: it applies EF migrations, (re)creates the per-service roles
# with the local role password below, and seeds seeds/dev.json. Running it
# again changes nothing.
#
# Port 8080 is the API's everywhere (ADR 0028, § Local). scripts/dev-up.sh
# runs this file through backend/scripts/dev-up.sh.
#
# backend/.env (written by scripts/dev-local-setup.sh, gitignored) feeds the
# ${VAR:-default} substitutions below: the `local-auth` issuer and client ids,
# so the app on :3000 signs in against this API with no AWS (ADR 0030). Without
# the file every value is empty and the protected routes fail closed (401).
#
# Postgres listens on 127.0.0.1:55432, not 5432, so it never collides with a
# Postgres already installed on the machine. The credentials are fixed,
# local-only development values: the database holds nothing but what a
# developer puts in it, and is reachable from this machine alone. Deployed
# environments use IAM database authentication, never a password from here.
#
# Data lives in the named volume `insolvia-backend-pgdata`, document bytes in
# `insolvia-backend-blobs`; `docker compose -f backend/docker-compose.yml
# down -v` wipes both.
#
# DOCUMENT BYTES. A deployed API presigns S3 URLs and the browser PUTs the
# file straight to the bucket. Here the `blobs` service stands in for the
# bucket: it is contract/scripts/aux-server.ts in its blobs-only mode, the
# same server the contract stack uses, sharing one directory (the volume) with
# the API's DirectoryDocumentBlobStore (INSOLVIA_LOCAL_BLOB_*, honoured only
# for INSOLVIA_ENV=local outside Lambda). Without it the API falls back to its
# memory twin, whose memory+s3:// URLs no browser can follow — so upload,
# download and every PDF preview failed on a laptop. No AWS credentials enter
# any container.
name: insolvia-backend

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: insolvia
      POSTGRES_USER: insolvia
      POSTGRES_PASSWORD: insolvia-local-only
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U insolvia -d insolvia']
      interval: 2s
      timeout: 3s
      retries: 15

  # A one-shot: it exits 0 when the database is current, and the API waits
  # for that. It connects as the superuser because it creates roles, as the
  # deployed migrator connects as the RDS master user.
  #
  # It then SEEDS seeds/dev.json and the fixture versions it names (as the
  # `migrator` role; INSOLVIA_SEED=false skips it), and a second `up` writes
  # nothing. The people's subjects are derived from their addresses, which is
  # what `local-auth` signs them in as (ADR 0030). The seeds arrive as a named
  # build context: seeds/ is outside this directory.
  migrator:
    build:
      context: .
      target: migrator-development
      additional_contexts:
        seeds: ../seeds
    environment:
      INSOLVIA_DB_CONNECTION_STRING: Host=postgres;Port=5432;Database=insolvia;Username=insolvia;Password=insolvia-local-only
      INSOLVIA_DB_ROLE_PASSWORD: insolvia-local-only
      INSOLVIA_ENV: ${INSOLVIA_ENV:-local}
      INSOLVIA_SEED: ${INSOLVIA_SEED:-true}
      # The fixture cases' sample documents land where the API reads them.
      INSOLVIA_SEED_DOCUMENT_DIR: /blobs
    volumes:
      - blobs:/blobs
    depends_on:
      postgres:
        condition: service_healthy
      blobs:
        condition: service_healthy

  api:
    build:
      context: .
      target: development
    environment:
      INSOLVIA_ENV: ${INSOLVIA_ENV:-local}
      # The API connects as its own role, `api`, never as the superuser — the
      # same least privilege it has on Aurora through IAM. Setting it composes
      # the Postgres stores (ApiComposition); the user directory, sealing keys
      # and blob store stay local twins.
      INSOLVIA_DB_CONNECTION_STRING: Host=postgres;Port=5432;Database=insolvia;Username=api;Password=insolvia-local-only
      # Token verification against `local-auth` (public values, from
      # backend/.env). Unset fails CLOSED: every protected route answers 401.
      # AUTH_JWKS_URL is the keys' address from inside this network, because
      # the issuer is the address the BROWSER uses.
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-}
      AUTH_PORTAL_CLIENT_ID: ${AUTH_PORTAL_CLIENT_ID:-}
      INSOLVIA_LOCAL_SUBJECTS: ${INSOLVIA_LOCAL_SUBJECTS:-}
      # Unset records mail in memory. http://host.docker.internal:8026 is the
      # local mailer scripts/dev-up.sh starts from an insolvia-services checkout.
      MAILER_API_URL: ${MAILER_API_URL:-}
      # The blob twin (see the header). The directory is shared with `blobs`;
      # the URL is what the API writes into each capability, so it is the
      # address the BROWSER reaches, not a container name.
      INSOLVIA_LOCAL_BLOB_DIR: /blobs
      INSOLVIA_LOCAL_BLOB_URL: http://localhost:8070
    volumes:
      - blobs:/blobs
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      migrator:
        condition: service_completed_successfully
      blobs:
        condition: service_healthy

  # The bucket's stand-in on 8070 (see the header). It runs as root only to
  # open the volume up: the API and the migrator write into it as the .NET
  # images' non-root user, and the API deletes what the browser uploaded, so
  # files and directories are made world-writable (umask 000). That is a
  # local-only volume on a port bound to 127.0.0.1. AUX_CORS_ORIGIN is the
  # app's dev server, the one origin allowed to PUT — as the bucket's CORS
  # rule names the deployed app's.
  blobs:
    image: node:24-alpine
    working_dir: /aux
    command: ['sh', '-c', 'umask 000 && chmod 0777 /blobs && exec node /aux/aux-server.ts']
    environment:
      CONTRACT_AUX_PORT: '8070'
      CONTRACT_BLOB_DIR: /blobs
      AUX_CORS_ORIGIN: http://localhost:3000
      AUX_LISTEN_HOST: 0.0.0.0
    volumes:
      - ../contract/scripts/aux-server.ts:/aux/aux-server.ts:ro
      - blobs:/blobs
    ports:
      - '127.0.0.1:8070:8070'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8070/health']
      interval: 2s
      timeout: 3s
      retries: 15

  # The Cognito hosted domain's stand-in on 8071 (ADR 0030): sign-in with no
  # AWS. Bound to 127.0.0.1 because it checks no password. LOCAL_AUTH_SUBJECTS
  # keeps people a real pool created in an existing database
  # (scripts/dev-local-setup.sh writes it).
  local-auth:
    image: node:24-alpine
    working_dir: /app
    command: ['node', '/app/server.ts']
    environment:
      LOCAL_AUTH_PORT: '8071'
      LOCAL_AUTH_PUBLIC_URL: http://localhost:8071
      LOCAL_AUTH_LISTEN_HOST: 0.0.0.0
      LOCAL_AUTH_SEED_FILE: /app/dev.json
      LOCAL_AUTH_SUBJECTS: ${LOCAL_AUTH_SUBJECTS:-}
    volumes:
      - ./local-auth/server.ts:/app/server.ts:ro
      - ../seeds/dev.json:/app/dev.json:ro
    ports:
      - '127.0.0.1:8071:8071'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8071/health']
      interval: 2s
      timeout: 3s
      retries: 15

  # The staff admin service on 8090, as its own role `admin` (firms, firm
  # users, the append-only audit). GOOGLE_CLIENT_ID unset fails every staff
  # route closed; FIRM_USER_POOL_ID unset mints subjects and mails nothing.
  admin:
    build:
      context: .
      target: admin-development
    environment:
      INSOLVIA_ENV: ${INSOLVIA_ENV:-local}
      INSOLVIA_DB_CONNECTION_STRING: Host=postgres;Port=5432;Database=insolvia;Username=admin;Password=insolvia-local-only
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FIRM_USER_POOL_ID: ${FIRM_USER_POOL_ID:-}
      INSOLVIA_LOCAL_SUBJECTS: ${INSOLVIA_LOCAL_SUBJECTS:-}
    ports:
      - '127.0.0.1:8090:8090'
    depends_on:
      migrator:
        condition: service_completed_successfully

  # The MCP server on 8788 (its endpoint is http://127.0.0.1:8788/mcp), as
  # its own role `mcp` — SELECT on cases and firms, candidates only for
  # writes. AUTH_CLIENT_IDS is the MCP harness allowlist (from backend/.env);
  # unset, every call answers 401.
  mcp:
    build:
      context: .
      target: mcp-development
    environment:
      INSOLVIA_ENV: ${INSOLVIA_ENV:-local}
      INSOLVIA_DB_CONNECTION_STRING: Host=postgres;Port=5432;Database=insolvia;Username=mcp;Password=insolvia-local-only
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_CLIENT_IDS: ${AUTH_CLIENT_IDS:-}
    ports:
      - '127.0.0.1:8788:8788'
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  pgdata:
    name: insolvia-backend-pgdata
  blobs:
    name: insolvia-backend-blobs
